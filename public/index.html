<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#4f46e5"/>
<title>Outreach Tracker</title>
<script>window.APP_BASE="%APP_BASE%";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet"/>

<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────────── */
:root{
  /* Palette is fully tokenised — re-skin the whole app by editing here. */
  --brand:#4f46e5; --brand-2:#6366f1; --brand-strong:#4338ca;
  --brand-soft:#eef0fe; --brand-soft-2:#e2e5fd;
  --emer:#0d9f6e; --emer-2:#10b981; --emer-soft:#e6f7f0;
  --amber:#d97706; --amber-soft:#fdf3e4;
  --violet:#7c3aed; --violet-soft:#f3eefe;
  --sky:#0284c7; --sky-soft:#e7f3fb;
  --red:#e11d48; --red-soft:#fdebef;

  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f4f5f9; --surface-3:#ecedf3;
  --border:#e7e8f0; --border-2:#d9dbe6;
  --text:#1b1f2a; --text-2:#586074; --text-3:#929aac; --faint:#c2c7d3;

  --hero-1:#4f46e5; --hero-2:#6d28d9;

  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(20,23,33,.05);
  --sh-2:0 1px 3px rgba(20,23,33,.06), 0 10px 24px -14px rgba(20,23,33,.18);
  --sh-3:0 24px 50px -20px rgba(20,23,33,.35);
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hebrew:'Frank Ruhl Libre','SBL Hebrew','Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;}
::selection{background:var(--brand-soft-2);}
#app{min-height:100%;}

/* ── APP SHELL (desktop) ───────────────────────────────────────── */
@media(min-width:900px){
  .shell{display:flex;height:100vh;overflow:hidden;}
  .page{flex:1;overflow-y:auto;background:var(--bg);}
  .page .hdr{position:sticky;top:0;z-index:10;}
  .page-inner,.dash,.sbody,.tsec{max-width:1040px;margin:0 auto;}
  .left-panel{width:452px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);}
  .left-scroll{flex:1;overflow-y:auto;}
  .right-panel{flex:1;overflow-y:auto;background:var(--surface-3);}
  .right-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-3);text-align:center;padding:40px;}
  .re-icon{font-size:46px;margin-bottom:14px;}
  .dbody{max-width:760px;margin:0 auto;padding:16px 22px 46px;}
  .dhdr{position:sticky;top:0;z-index:5;padding:12px 18px;}
  /* Lift cards off the panel so the detail view reads with structure, not a wash of
     white — and keep desktop compact (tighter padding/spacing than mobile). */
  .right-panel .card{box-shadow:var(--sh-2);border-color:var(--border-2);padding:13px 15px;margin-bottom:10px;}
  .right-panel .ctitle{margin-bottom:9px;}
}
@media(max-width:899px){
  .mobile{padding-bottom:74px;}
  .greenbox{padding:8px 11px;font-size:13px;font-weight:700;background:transparent;color:var(--brand);align-self:center;}
}

/* ── SIDEBAR / BOTTOM NAV ──────────────────────────────────────── */
.nav{display:flex;background:var(--surface);}
.nav-brand,.nav-foot{display:none;}
.nav-items{display:flex;flex:1;}
.nav-btn{flex:1;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:10px;font-weight:600;transition:color .15s,background .15s;border-radius:10px;}
.nav-btn.active{color:var(--brand);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{display:flex;align-items:center;gap:3px;letter-spacing:.2px;}
.badge{background:var(--red);color:#fff;border-radius:var(--r-pill);padding:0 5px;font-size:9px;font-weight:700;line-height:15px;min-width:15px;text-align:center;}
@media(max-width:899px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));box-shadow:0 -1px 14px rgba(20,23,33,.06);}
}
@media(min-width:900px){
  .nav{flex-direction:column;width:248px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 14px;gap:4px;}
  .nav-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;}
  .nav-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;box-shadow:var(--sh-2);}
  .nav-brand-title{font-size:16px;font-weight:800;letter-spacing:-.3px;}
  .nav-brand-sub{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .nav-items{flex-direction:column;flex:0;gap:3px;}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--text-2);width:100%;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--brand-soft);color:var(--brand);}
  .nav-btn .nav-icon{font-size:18px;}
  .nav-foot{display:block;margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
  .nav-user{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;}
  .nav-user-av{width:34px;height:34px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-user-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .nav-user-role{font-size:11px;color:var(--text-3);text-transform:capitalize;}
  .nav-logout{width:100%;padding:9px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600;transition:background .15s;}
  .nav-logout:hover{background:var(--surface-3);color:var(--text);}
}

/* ── PAGE HEADER ───────────────────────────────────────────────── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px 16px;}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.hdr-top:last-child{margin-bottom:0;}
.hdr-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.hdr-sub{font-size:12.5px;color:var(--text-3);margin-top:3px;font-weight:500;}
.hdr-btns{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.hbtn{padding:8px 13px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-2);font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;}
.hbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
.hbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.hbtn.primary:hover{background:var(--brand-strong);color:#fff;}
.hbtn.bulk-toggle{background:var(--amber);border-color:var(--amber);color:#fff;}
.hbtn.bulk-toggle:hover{background:#b45e04;border-color:#b45e04;color:#fff;}
.hbtn.bulk-toggle.on{background:var(--surface);border-color:var(--amber);color:var(--amber);}
.drow.compact{padding:11px 14px;align-items:center;user-select:none;-webkit-user-select:none;}
.drow.compact.bulk-on{background:var(--brand-soft);border-left-color:var(--brand);}

/* ── PROGRESS BARS ─────────────────────────────────────────────── */
.pbars{display:grid;gap:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;}
@media(min-width:560px){.pbars{grid-template-columns:1fr 1fr;}}
.pbar{min-width:0;}
.pbar-lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px;font-weight:600;color:var(--text-2);}
.pbar-lbl span:last-child{color:var(--text);font-variant-numeric:tabular-nums;}
.pbar-bg{background:var(--surface-3);border-radius:var(--r-pill);height:8px;overflow:hidden;}
.pbar-fill{border-radius:var(--r-pill);height:8px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.pbar-hebrew{font-size:13px;color:var(--text-3);text-align:right;margin-top:5px;direction:rtl;font-family:var(--hebrew);}

/* ── SEGMENTED TABS ────────────────────────────────────────────── */
.tab-toggle{display:flex;border-radius:var(--r-sm);border:1px solid var(--border);padding:3px;gap:3px;background:var(--surface-2);}
.tab-btn{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;font-weight:700;transition:all .18s;color:var(--text-2);}
.tab-btn.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1);}
.tab-btn.off:hover{color:var(--text);}

/* ── SEARCH ────────────────────────────────────────────────────── */
.sbar{padding:13px 16px 9px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9;}
.sinput{width:100%;padding:10px 13px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;transition:all .15s;}
.sinput:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.frow{display:flex;flex-wrap:wrap;gap:7px;padding:9px 0 3px;align-items:center;}
.fchip{padding:6px 12px;border-radius:var(--r-pill);border:1.5px solid var(--border);white-space:nowrap;font-size:12px;font-weight:600;background:var(--surface);color:var(--text-2);flex-shrink:0;transition:all .15s;}
.fchip:hover{border-color:var(--brand);color:var(--brand);}
.fchip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.ssel{margin-left:auto;padding:6px 9px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);font-size:12px;background:var(--surface);color:var(--text-2);flex-shrink:0;font-weight:600;}

/* ── DONOR ROW ─────────────────────────────────────────────────── */
.drow{background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--border);border-left:3px solid transparent;display:flex;align-items:flex-start;gap:12px;transition:background .14s,border-color .14s;cursor:pointer;}
.drow:hover{background:var(--surface-2);}
.drow.touched{border-left-color:var(--brand-soft-2);}
.drow.overdue{border-left-color:var(--red);}
.drow.fulfilled{border-left-color:var(--emer);}
.drow.selected-row{background:var(--brand-soft);border-left-color:var(--brand);}
.dcb{width:24px;height:24px;border-radius:7px;border:2px solid var(--border-2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;}
.dcb.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.dmain{flex:1;min-width:0;}
.dname{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
.dmeta{font-size:12px;color:var(--text-3);margin-top:3px;}
.dlast{font-size:12px;color:var(--text-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dright{text-align:right;flex-shrink:0;}
.damt{font-weight:800;font-size:15px;color:var(--emer);font-variant-numeric:tabular-nums;}
.dwas{font-size:10px;color:var(--faint);margin-top:1px;}
.mbars{margin-top:8px;}
.mbar-bg{background:var(--surface-3);border-radius:var(--r-pill);height:4px;margin-bottom:3px;overflow:hidden;}
.mbar-fill{border-radius:var(--r-pill);height:4px;transition:width .5s;}
.mbar-lbl{font-size:9.5px;color:var(--text-3);display:flex;gap:10px;font-weight:700;}

/* ── BULK BAR ──────────────────────────────────────────────────── */
.bulkbar{background:var(--brand);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
.bulkbar button{padding:6px 13px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;transition:all .15s;}
.bulkbar button:hover:not(:disabled){background:rgba(255,255,255,.26);}
.bulkbar button:disabled{opacity:.45;cursor:not-allowed;}
.bulkbar button.primary{background:#fff;color:var(--brand);border-color:#fff;}

/* ── DETAIL HEADER ─────────────────────────────────────────────── */
.dhdr{background:var(--surface);border-bottom:1px solid var(--border);padding:15px 18px;display:flex;align-items:center;gap:12px;}
.backbtn{color:var(--text-2);font-size:26px;line-height:1;flex-shrink:0;transition:transform .15s,color .15s;}
.backbtn:active{transform:translateX(-2px);}
.dh-main{flex:1;min-width:0;}
.dhtitle{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.3px;}
.dhsub{font-size:12px;color:var(--text-3);margin-top:2px;}
.tier-badge{font-size:11px;padding:4px 10px;border-radius:var(--r-pill);font-weight:700;flex-shrink:0;}
.dbody{padding:16px;padding-bottom:96px;}

/* ── CARDS ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:13px;box-shadow:var(--sh-1);}
.ctitle{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center;margin-bottom:12px;}
.tcell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 3px;}
.tlbl{font-size:9.5px;color:var(--text-3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.tval{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.tval-inp{width:100%;border:none;border-bottom:1px dashed var(--border-2);background:transparent;text-align:center;font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;padding:1px 0;appearance:textfield;-moz-appearance:textfield;}
.tval-inp::-webkit-outer-spin-button,.tval-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tval-inp:focus{outline:none;color:var(--brand);border-bottom-color:var(--brand);}
.r2{display:flex;gap:9px;margin-top:7px;}
.inp{flex:1;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;transition:all .15s;}
.inp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.greenbox{padding:10px 14px;background:var(--brand-soft);border-radius:var(--r-sm);font-weight:800;color:var(--brand);display:flex;align-items:center;white-space:nowrap;}
.clink{display:block;color:var(--brand);font-weight:600;text-decoration:none;margin-bottom:2px;padding:6px 0;transition:color .15s;}
.clink:hover{color:var(--brand-strong);}
.nbox{margin-top:10px;padding:11px 13px;background:var(--amber-soft);border:1px solid #f6e2bf;border-radius:var(--r-sm);font-size:13px;color:#7a5212;line-height:1.5;}
.camp-switch{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
.camp-ico{font-size:15px;flex-shrink:0;}
.camp-switch select{flex:1;min-width:0;padding:8px 10px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);font-size:14px;font-weight:700;color:var(--text);outline:none;}
.camp-btn{flex-shrink:0;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;}
.camp-btn:active{transform:scale(.96);}
.camp-btn.danger{color:var(--red);border-color:#f3c9c9;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:var(--r-pill);border:1.5px solid var(--border);font-size:12px;background:var(--surface);color:var(--text-2);white-space:nowrap;font-weight:600;transition:all .15s;}
.chip:hover{border-color:var(--brand);color:var(--brand);}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cf-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;}
.cf-lbl{font-size:9.5px;color:var(--text-3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.cf-val{font-size:13px;color:var(--text);font-weight:600;}
.coll-toggle{width:100%;text-align:left;font-size:13px;color:var(--brand);padding:5px 0;font-weight:600;}
.subhd{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field-lbl{font-size:11px;color:var(--text-3);font-weight:600;display:block;margin-bottom:4px;}

/* ── ACCESS CARD ───────────────────────────────────────────────── */
.access-row{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.access-lbl{width:90px;flex-shrink:0;color:var(--text-3);font-weight:600;}
.access-val{flex:1;font-weight:600;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.chip-sm{background:var(--brand-soft);color:var(--brand);border-radius:var(--r-pill);padding:3px 10px;font-size:11.5px;font-weight:700;}

/* ── ARC ───────────────────────────────────────────────────────── */
.arc{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;margin:6px 0 8px;}
.arc::-webkit-scrollbar{display:none;}
.astep{display:flex;flex-direction:column;align-items:center;flex:1;min-width:48px;}
.adot{width:25px;height:25px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
.adot.done{background:var(--brand);border-color:var(--brand);color:#fff;}
.adot.cur{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700;transform:scale(1.16);box-shadow:0 2px 8px var(--brand-soft-2);}
.albl{font-size:9px;color:var(--text-3);margin-top:5px;text-align:center;line-height:1.25;max-width:54px;font-weight:600;}
.albl.done{color:var(--brand);}
.aline{height:2px;background:var(--border-2);flex:1;margin-bottom:15px;min-width:6px;transition:background .3s;}
.aline.done{background:var(--brand);}

/* ── PLEDGE ────────────────────────────────────────────────────── */
.pledge-box{background:var(--emer-soft);border:1px solid #c6ecdb;border-radius:var(--r-sm);padding:14px;margin-top:9px;}
.pledge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600;}
.pay-plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;}
.pay-chip{padding:9px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;text-align:center;background:var(--surface);color:var(--text-2);font-weight:600;transition:all .15s;}
.pay-chip:hover{border-color:var(--emer);}
.pay-chip.on{background:var(--emer);color:#fff;border-color:var(--emer);}
.payment-log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.payment-log-item:last-child{border-bottom:none;}

/* ── TP BARS ───────────────────────────────────────────────────── */
.tp-bar{margin-bottom:11px;}
.tp-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:600;}
.tp-bg{background:var(--surface-3);border-radius:var(--r-pill);height:7px;overflow:hidden;}
.tp-fill{border-radius:var(--r-pill);height:7px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.tp-adj-row{display:flex;align-items:center;gap:8px;margin-top:5px;}
.tadj{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-2);background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all .15s;}

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────
const TIERS=['star','major','mid','general'];
const TIER_CFG={
  star:{label:'⭐ Top Future',bg:'#f3eefe',color:'#7c3aed'},
  major:{label:'🥇 Major',bg:'#fdf2e3',color:'#b45309'},

const KNOWN_COLS=new Set(['Name','Household: Account ID','High','Medium','Low','Actual','Amb.','Tier','Latest Donation ','Latest Donation','Latest Donation Date','Largest Donation','2025','2024','2023','2022','2021','Primary Contact: Name','Primary Contact: Contact ID','Secondary Contact: Name','Secondary Contact: Contact ID','Primary Contact: Email','Primary Contact: Mobile Phone','Secondary Contact: Email','Secondary Contact: Mobile Phone','Primary  Last Activity','Primary Last Activity','Street','City','State','Postal Code','Event (Primary Contact)',' Event Date (Primary Contact)','Event (Secondary Contact)','Event Date (Secondary Contact)','Capitol Campaign','YK Appeal','Chai Club? - included in total. Not done for everyone','Kiddush Sponsor']);

// ── PERSISTENCE / API ─────────────────────────────────────────────
let APP_BASE=window.APP_BASE||''; if(APP_BASE.indexOf('%')>-1)APP_BASE='';
function defaultSettings(){return{tierDefaults:{star:{retail:4,wholesale:4},major:{retail:3,wholesale:4},mid:{retail:2,wholesale:4},general:{retail:1,wholesale:4}},dailyGoal:10,dashSort:'tier'};}

function api(path,opts){
  return fetch(APP_BASE+'/api'+path,Object.assign({headers:{'Content-Type':'application/json'},credentials:'same-origin'},opts||{}))
    .then(async r=>{
      if(r.status===401){currentUser=null;renderLogin();const e=new Error('unauthorized');e.code=401;throw e;}
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
      return data;
    });
}

// ── STATE ─────────────────────────────────────────────────────────
let currentUser=null, allUsers=[];
let donors=[], settings=defaultSettings();
let campaigns=[], activeCampaignId=null;

let bulkMode=false,bulkSel=new Set(),lastBulkIdx=null;

let micActive=false,micTarget=null,recognition=null;

// ── SYNC QUEUE ─────────────────────────────────────────────────────
const dirtyContacts=new Set();
let settingsDirty=false, dashDirty=false, flushTimer=null;
function setStatus(s){const el=document.getElementById('sync-pill');if(!el)return;el.className='sync-pill '+s;el.textContent=s==='saving'?'Saving…':s==='offline'?'Offline — will retry':'Saved';}
function scheduleFlush(){setStatus('saving');if(flushTimer)clearTimeout(flushTimer);flushTimer=setTimeout(flush,500);}
function markContact(id){dirtyContacts.add(id);scheduleFlush();}
function markSettings(){settingsDirty=true;scheduleFlush();}
function markDash(){dashDirty=true;scheduleFlush();}
async function flush(){
  flushTimer=null;
  try{
    for(const id of [...dirtyContacts]){
      const c=getDonor(id);
      if(c)await api('/contacts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(c)});
      dirtyContacts.delete(id);
    }
    if(settingsDirty){await api('/settings',{method:'PUT',body:JSON.stringify(settings)});settingsDirty=false;}
    if(dashDirty){await api('/dash',{method:'PUT',body:JSON.stringify(dashState)});dashDirty=false;}
    setStatus('saved');writeCache();
  }catch(e){
    if(e.code===401)return;
    setStatus('offline');writeCache();
    setTimeout(()=>{if(dirtyContacts.size||settingsDirty||dashDirty)flush();},5000);
  }
}
window.addEventListener('online',()=>{if(dirtyContacts.size||settingsDirty||dashDirty)flush();});

// ── OFFLINE CACHE ──────────────────────────────────────────────────
function cacheKey(){return 'ot_cache_'+(currentUser?currentUser.id:'anon');}
function writeCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({donors,settings,dashState,campaigns,activeCampaignId}));}catch{}}
function readCache(){try{return JSON.parse(localStorage.getItem(cacheKey()));}catch{return null;}}

// ── UTILS ─────────────────────────────────────────────────────────
function getDonor(id){return donors.find(d=>d.id===id);}
function campaignDonorsAll(){return activeCampaignId?donors.filter(d=>d.campaignId===activeCampaignId):donors;}
function isActiveStatus(d){return !d.status||d.status==='active';}
// Active views/counts/exports all flow through campaignDonors(), so excluding
// archived + trashed here hides them everywhere at once.
function campaignDonors(){return campaignDonorsAll().filter(isActiveStatus);}
function canManageContact(d){return !!currentUser&&(currentUser.role==='admin'||d.ownerId===currentUser.id);}
function archivedDonors(){return campaignDonorsAll().filter(d=>d.status==='archived'&&canManageContact(d));}
function trashedDonors(){return campaignDonorsAll().filter(d=>d.status==='trashed'&&canManageContact(d));}
function updateDonor(id,ch){donors=donors.map(d=>d.id===id?{...d,...ch}:d);markContact(id);}
function str(v){return String(v==null?'':v).trim();}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(n){return(!n&&n!==0)||n===0?'—':'$'+Number(n).toLocaleString();}
function fmtDate(v){if(!v)return'';try{const d=new Date(typeof v==='number'?Math.round((v-25569)*86400000):v+'T12:00:00');return isNaN(d)?String(v):d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch{return String(v);}}
function isPledged(d){return(d.pledgeAmount&&d.pledgeAmount>0)||(d.preArcStage>=4)||d.postArcStage!==undefined;}
function isFulfilled(d){return d.pledgeAmount>0&&(d.pledgePaid||0)>=d.pledgeAmount;}
function taskDueStatus(d){if(!d)return'upcoming';const diff=Math.floor((new Date(d+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);return diff<0?'overdue':diff===0?'today':'upcoming';}
function taskDueLabel(d){if(!d)return'';const diff=Math.floor((new Date(d+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);if(diff<0)return`${Math.abs(diff)}d overdue`;if(diff===0)return'Due today';if(diff===1)return'Due tomorrow';return'Due '+new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function getAllTasks(){return campaignDonors().flatMap(d=>(d.tasks||[]).filter(t=>!t.done).map(t=>({...t,donorId:d.id,donorName:d.name})));}
function overdueTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='overdue');}
function todayTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='today');}
function upcomingTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='upcoming').sort((a,b)=>(a.due||'').localeCompare(b.due||''));}
function userName(id){const u=allUsers.find(x=>x.id===id);return u?(u.name||u.email):'';}

function getStreak(){return dashState.streak||{date:'',count:0,lastGoal:0};}
function displayStreakCount(){
  const s=getStreak();
  if(!s.date)return 0;
  const t=today();
  const y=new Date();y.setDate(y.getDate()-1);
  const yStr=y.toISOString().slice(0,10);
  return(s.date===t||s.date===yStr)?s.count:0;
}
function updateStreak(goalMet){
  const s=getStreak();
  const t=today();
  if(s.date===t)return s;
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  const newCount=goalMet?(s.date===yStr?s.count+1:1):0;
  dashState.streak={date:t,count:newCount,lastGoal:settings.dailyGoal};
  markDash();
  return dashState.streak;
}

function pledgeSummary(){
  const p=campaignDonors().filter(isPledged);
  const tp=p.reduce((s,d)=>s+(d.pledgeAmount||0),0);
  const paid=p.reduce((s,d)=>s+(d.pledgePaid||0),0);
  return{count:p.length,totalPledged:tp,totalPaid:paid,fulfilled:p.filter(isFulfilled).length,paidPct:tp>0?Math.round(paid/tp*100):0};
}
function getStats(){
  const D=campaignDonors();
  const total=D.length;
  const contacted=D.filter(d=>(d.interactions||[]).length>0).length;
  const ps=pledgeSummary();
  const tgt=D.reduce((s,d)=>s+(d.target||0),0);
  const courtingDonors=D.filter(d=>!isPledged(d));
  const totalRetailTarget=courtingDonors.reduce((s,d)=>s+(d.retailTarget||1),0);
  const totalRetailDone=courtingDonors.reduce((s,d)=>s+(d.interactions||[]).filter(i=>!['📄 Report','📰 Newsletter'].includes(i.type)).length,0);
  const pledgedDonors=D.filter(isPledged);
  const totalStewardTarget=pledgedDonors.reduce((s,d)=>s+(d.retailTarget||1)+(d.wholesaleTarget||1),0);
  const totalStewardDone=pledgedDonors.reduce((s,d)=>s+(d.interactions||[]).length,0);
  return{total,contacted,tgt,outPct:totalRetailTarget>0?Math.round(totalRetailDone/totalRetailTarget*100):0,
    stewardPct:totalStewardTarget>0?Math.round(totalStewardDone/totalStewardTarget*100):0,...ps};
}

// ── IMPORT ────────────────────────────────────────────────────────
function parseDonorRow(row){
  const name=str(row['Name']);if(!name)return null;
  const get=(...keys)=>{for(const k of keys){if(row[k]!==undefined&&row[k]!==''&&row[k]!==null)return row[k];}return '';};
  const tier=TIERS.includes(str(row['Tier']).toLowerCase())?str(row['Tier']).toLowerCase():'general';
  const custom={};
  Object.keys(row).forEach(k=>{if(!KNOWN_COLS.has(k)&&str(row[k])!=='')custom[k]=str(row[k]);});
  const high=parseFloat(row['High'])||0;
  const id=str(row['Primary Contact: Contact ID'])||(name+'_'+Math.random().toString(36).slice(2));
  return{id,name,householdId:str(row['Household: Account ID']),pName:str(row['Primary Contact: Name']),sName:str(row['Secondary Contact: Name']),
    pPhone:str(get('Primary Contact: Mobile Phone')),sPhone:str(get('Secondary Contact: Mobile Phone')),
    pEmail:str(get('Primary Contact: Email')),sEmail:str(get('Secondary Contact: Email')),
    pId:str(row['Primary Contact: Contact ID']),sId:str(row['Secondary Contact: Contact ID']),
    high,medium:parseFloat(row['Medium'])||0,low:parseFloat(row['Low'])||0,target:high,
    actual:parseFloat(row['Actual'])||0,latestDonation:parseFloat(get('Latest Donation ','Latest Donation'))||0,
    latestDate:fmtDate(get('Latest Donation Date')),largestDonation:parseFloat(row['Largest Donation'])||0,
    city:str(row['City']),state:str(row['State']),street:str(row['Street']),zip:str(row['Postal Code']),
    notes:str(row['Amb.']),tier,years:['2021','2022','2023','2024','2025'].reduce((o,y)=>{const v=parseFloat(row[y]);if(v)o[y]=v;return o;},{}),
    custom,preArcStage:0,postArcStage:undefined,pledgeAmount:0,pledgePaid:0,pledgePlan:'',pledgePlanNote:'',payments:[],
    retailTarget:settings.tierDefaults[tier].retail,wholesaleTarget:settings.tierDefaults[tier].wholesale,
    interactions:[],tasks:[]};
}

function handleFile(file){
  const r=new FileReader();
  r.onload=e=>{
    let rows;
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      if(!wb.SheetNames.length){alert('That file has no sheets to read.');return;}
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }catch(err){alert('Could not read file: '+err.message);return;}
    if(!rows.length){alert('That sheet is empty — no data rows were found.');return;}
    if(rows[0]['Name']===undefined){
      alert('This file doesn’t have a "Name" column, so it can’t be a contact list.\n\nUse "Download sample" to see the expected columns.');return;
    }

    // Validate every row. Header is spreadsheet row 1, so data row i is row i+2.
    const issues=[]; // {row, level:'error'|'warning', name, msg}
    const valid=[];  // parsed contacts that will be imported
    const seenPid={};
    rows.forEach((row,i)=>{
      const excelRow=i+2;
      const name=str(row['Name']);
      if(!name){issues.push({row:excelRow,level:'error',name:'',msg:'No Name — row skipped (cannot import).'});return;}
      const missing=[];
      if(!str(row['Household: Account ID']))missing.push('Household: Account ID');
      if(!str(row['Primary Contact: Contact ID']))missing.push('Primary Contact: Contact ID');
      if(missing.length)issues.push({row:excelRow,level:'warning',name,msg:'Missing '+missing.join(' & ')+' — imports, but won’t sync with Salesforce.'});
      const pid=str(row['Primary Contact: Contact ID']);
      if(pid){
        if(seenPid[pid])issues.push({row:excelRow,level:'warning',name,msg:'Same Primary Contact ID as row '+seenPid[pid]+' — these will be treated as one contact.'});
        else seenPid[pid]=excelRow;
      }
      valid.push(parseDonorRow(row));
    });

    const doImport=()=>{
      // Preserve any existing activity for contacts already in my list.
      valid.forEach(p=>{p.campaignId=activeCampaignId;const ex=campaignDonorsAll().find(d=>d.id===p.id||d.name===p.name);
        if(ex){p.id=ex.id;p.campaignId=ex.campaignId;p.interactions=ex.interactions;p.tasks=ex.tasks;p.preArcStage=ex.preArcStage;p.postArcStage=ex.postArcStage;
          p.pledgeAmount=ex.pledgeAmount;p.pledgePaid=ex.pledgePaid;p.pledgePlan=ex.pledgePlan||'';
          p.pledgePlanNote=ex.pledgePlanNote||'';p.payments=ex.payments||[];p.status=ex.status;
          p.target=ex.target;p.retailTarget=ex.retailTarget;p.wholesaleTarget=ex.wholesaleTarget;}});
      setStatus('saving');
      api('/contacts/bulk',{method:'POST',body:JSON.stringify({contacts:valid})})
        .then(res=>{donors=res.contacts||donors;setStatus('saved');writeCache();render();
          alert(`Imported ${res.created} new contact${res.created!==1?'s':''}, updated ${res.updated}${res.skipped?', skipped '+res.skipped+' (no access)':''}.`);})
        .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Import failed: '+err.message);});
    };

    if(!valid.length){showImportReport({total:rows.length,valid,issues,onConfirm:null});return;}
    if(issues.length){showImportReport({total:rows.length,valid,issues,onConfirm:doImport});return;}
    doImport();
  };
  r.readAsArrayBuffer(file);
}

// Pre-import review: lists skipped/flagged rows and lets the user import the rest.
function showImportReport({total,valid,issues,onConfirm}){
  const errors=issues.filter(x=>x.level==='error').length;
  const warns=issues.filter(x=>x.level==='warning').length;
  const shown=issues.slice(0,200);
  const list=shown.map(x=>`<div class="imp-row ${x.level}"><span class="imp-rn">Row ${x.row}</span><span class="imp-nm">${esc(x.name||'—')}</span><div class="imp-msg">${esc(x.msg)}</div></div>`).join('')
    +(issues.length>shown.length?`<div class="imp-row"><div class="imp-msg" style="grid-column:1/-1;">…and ${issues.length-shown.length} more.</div></div>`:'');
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Review import</div>
    <div class="msub">${total} row${total!==1?'s':''} read · <b>${valid.length}</b> ready · ${errors} skipped · ${warns} warning${warns!==1?'s':''}</div>
    <div class="imp-list">${list||'<div class="imp-row"><div class="imp-msg" style="grid-column:1/-1;">No problems found.</div></div>'}</div>
    <div class="mrow"><button class="mbtn s" id="imp-cancel">${onConfirm?'Cancel':'Close'}</button>${onConfirm?`<button class="mbtn p" id="imp-go">Import ${valid.length} contact${valid.length!==1?'s':''}</button>`:''}</div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('imp-cancel').onclick=()=>m.remove();
  if(onConfirm)document.getElementById('imp-go').onclick=()=>{m.remove();onConfirm();};
}

    (d.interactions||[]).forEach(i=>{rows.push([d.id,d.name,str(i.type).replace(/[^\w\s]/gi,''),i.date||today(),(i.note||'').replace(/,/g,';'),i.type.includes('Call')||i.type.includes('Meeting')?'Call':'Other',i.spouse||'','Completed']);});

}

// ── VOICE ─────────────────────────────────────────────────────────
function resetMicBtn(targetId){const btn=document.getElementById('mic-'+targetId);if(btn){btn.className='micbtn';btn.textContent='🎤';}}
function startMic(targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!window.isSecureContext){
    alert('Voice-to-text isn’t available here'+(!window.isSecureContext?' (needs a secure https connection)':' on this browser')+'.\n\nTip: tap the 🎤 on your phone keyboard to dictate straight into the note instead.');
    return;
  }
  if(recognition){try{recognition.stop();}catch(e){}}
  recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=e=>{const txt=e.results[0][0].transcript;const el=document.getElementById(targetId);if(el){el.value+=(el.value?' ':'')+txt;el.dispatchEvent(new Event('input'));}};
  recognition.onerror=e=>{micActive=false;micTarget=null;resetMicBtn(targetId);
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){alert('Microphone access is blocked. Allow mic access for this site in your browser settings, then tap 🎤 again.');}
    else if(e.error==='no-speech'){/* user said nothing — ignore quietly */}
    else if(e.error&&e.error!=='aborted'){alert('Voice input error: '+e.error);}
  };
  recognition.onend=()=>{micActive=false;micTarget=null;resetMicBtn(targetId);};
  try{
    recognition.start();
    micActive=true;micTarget=targetId;
    const btn=document.getElementById('mic-'+targetId);if(btn){btn.className='micbtn on';btn.textContent='⏹';}
  }catch(e){micActive=false;micTarget=null;resetMicBtn(targetId);alert('Could not start voice input. Make sure no other app is using the microphone, then try again.');}
}
function stopMic(){if(recognition)recognition.stop();micActive=false;micTarget=null;}

// ── DASHBOARD CALL LIST ───────────────────────────────────────────
function getDashCalls(){
  if(dashState.day!==today()){dashState.doneCalls=[];dashState.day=today();markDash();}
  const goal=settings.dailyGoal||10;
  const sortMode=settings.dashSort||'tier';
  let pool=campaignDonors().filter(d=>!isPledged(d));
  if(sortMode==='overdue'){
    const odIds=new Set(overdueTasks().map(t=>t.donorId));
    pool=pool.sort((a,b)=>{const aOD=odIds.has(a.id)?1:0,bOD=odIds.has(b.id)?1:0;return bOD-aOD||(b.target||0)-(a.target||0);});
  } else if(sortMode==='tier'){
    const tierOrder={star:0,major:1,mid:2,general:3};
    pool=pool.sort((a,b)=>((tierOrder[a.tier]||3)-(tierOrder[b.tier]||3))||((b.target||0)-(a.target||0)));
  } else {
    pool=pool.sort((a,b)=>(b.target||0)-(a.target||0));
  }
  const odIds=new Set(overdueTasks().map(t=>t.donorId));
  const odPool=pool.filter(d=>odIds.has(d.id));
  const regPool=pool.filter(d=>!odIds.has(d.id));
  return [...odPool,...regPool].slice(0,goal);
}

function arcHTML(d,clickable){
  const isPost=d.postArcStage!==undefined;const steps=isPost?POST_ARC:PRE_ARC;const stage=isPost?d.postArcStage:(d.preArcStage||0);
  let h='<div class="arc">';
  steps.forEach((s,i)=>{const done=i<stage,cur=i===stage;if(i>0)h+=`<div class="aline${i<=stage?' done':''}"></div>`;h+=`<div class="astep"><div class="adot${done?' done':cur?' cur':''}"${clickable?` data-arc="${i}"`:''}>  ${done?'✓':cur?'●':''}</div><div class="albl${done?' done':''}">${s}</div></div>`;});
  return h+'</div>';
}

function miniBarsHTML(d,pledgedTab){
  if(pledgedTab){
    const done=(d.interactions||[]).length;
    const target=(d.retailTarget||1)+(d.wholesaleTarget||1);
    const pct=Math.min(100,Math.round(done/target*100));
    return`<div class="mbars"><div class="mbar-bg"><div class="mbar-fill" style="width:${pct}%;background:var(--emer);"></div></div><div class="mbar-lbl"><span style="color:var(--emer);">🤝 ${done}/${target} stewardship</span></div></div>`;
  }
  const ret=(d.interactions||[]).filter(i=>!['📄 Report','📰 Newsletter'].includes(i.type)).length;
  const who=(d.interactions||[]).filter(i=>['📄 Report','📰 Newsletter'].includes(i.type)).length;
  const rp=Math.min(100,Math.round(ret/(d.retailTarget||1)*100)),wp=Math.min(100,Math.round(who/(d.wholesaleTarget||1)*100));

function getFiltered(){
  return campaignDonors().filter(d=>{
    const q=searchVal.toLowerCase();const ms=!q||d.name.toLowerCase().includes(q)||(d.city||'').toLowerCase().includes(q);
    const mf=filterVal==='All'||d.tier===filterVal||(filterVal==='Overdue'&&overdueTasks().some(t=>t.donorId===d.id));
    const tab=listTab==='pledged'?isPledged(d):!isPledged(d);return ms&&mf&&tab;
  }).sort((a,b)=>{
    if(sortVal==='target')return(b.target||0)-(a.target||0);if(sortVal==='name')return a.name.localeCompare(b.name);
    if(sortVal==='activity')return(b.interactions?.length||0)-(a.interactions?.length||0);if(sortVal==='pledge')return(b.pledgeAmount||0)-(a.pledgeAmount||0);return 0;
  });
}

// ── NAV ────────────────────────────────────────────────────────────
function campaignSwitcherHTML(){
  if(!campaigns.length)return '';
  const isAdmin=currentUser&&currentUser.role==='admin';
  const opts=campaigns.map(c=>`<option value="${c.id}"${c.id===activeCampaignId?' selected':''}>${esc(c.name)}</option>`).join('');
  return`<div class="camp-switch">
    <span class="camp-ico">🎯</span>
    <select id="camp-sel" title="Active campaign">${opts}</select>
    <button class="camp-btn" id="camp-new">＋ New</button>
    ${isAdmin&&campaigns.length>1?`<button class="camp-btn danger" id="camp-del" title="Delete this campaign">🗑</button>`:''}
  </div>`;
}
function switchCampaign(id){
  if(id===activeCampaignId)return;
  activeCampaignId=id;settings.defaultCampaignId=id;markSettings();
  desktopDetailId=null;detailId=null;if(view==='detail')view='list';
  render();
}
function createCampaignPrompt(){
  const name=prompt('Name this campaign (for example: "2026 Annual Campaign"):');
  if(!name||!name.trim())return;
  setStatus('saving');
  api('/campaigns',{method:'POST',body:JSON.stringify({name:name.trim()})})
    .then(res=>{campaigns=res.campaigns||campaigns;activeCampaignId=res.campaign.id;settings.defaultCampaignId=activeCampaignId;markSettings();
      desktopDetailId=null;detailId=null;if(view==='detail')view='list';writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not create the campaign: '+err.message);});
}
function deleteCampaignPrompt(){
  const c=campaigns.find(x=>x.id===activeCampaignId);if(!c)return;
  const n=donors.filter(d=>d.campaignId===activeCampaignId).length;
  if(!confirm(`Delete the campaign “${c.name}” and permanently remove its ${n} contact${n!==1?'s':''}?\n\nThis cannot be undone.`))return;
  setStatus('saving');
  api('/campaigns/'+encodeURIComponent(activeCampaignId),{method:'DELETE'})
    .then(res=>{const goneId=c.id;campaigns=res.campaigns||[];donors=donors.filter(d=>d.campaignId!==goneId);
      activeCampaignId=(campaigns[0]&&campaigns[0].id)||null;settings.defaultCampaignId=activeCampaignId;markSettings();
      desktopDetailId=null;detailId=null;if(view==='detail')view='list';writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not delete the campaign: '+err.message);});
}
// Permanent, irreversible delete (used by the Recycle Bin's "Delete forever").
function deleteContact(id){
  const d=getDonor(id);if(!d)return;
  if(!confirm(`Permanently delete “${d.name}” and everything logged on this contact?\n\nThis cannot be undone.`))return;
  setStatus('saving');
  api('/contacts/'+encodeURIComponent(id),{method:'DELETE'})
    .then(()=>{donors=donors.filter(x=>x.id!==id);dirtyContacts.delete(id);
      if(desktopDetailId===id)desktopDetailId=null;
      if(detailId===id){detailId=null;if(view==='detail')view='list';}
      writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not delete: '+err.message);});
}
// Soft state changes: archive / trash / restore (persist as a `status` field).
function setContactStatus(id,status){
  if(!getDonor(id))return;
  updateDonor(id,{status,statusAt:Date.now()});
  if(desktopDetailId===id)desktopDetailId=null;
  if(detailId===id){detailId=null;if(view==='detail')view='list';}
  render();
}
function restoreContact(id){if(!getDonor(id))return;updateDonor(id,{status:'active',statusAt:Date.now()});render();}
// Asks whether to archive (keep) or trash (recycle bin) when removing a contact.
function showRemoveOptions(id){
  const d=getDonor(id);if(!d)return;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Remove ${esc(d.name)}?</div>
    <div class="msub">Choose what happens to this contact. Both can be undone from Settings → Archived &amp; Recycle Bin.</div>
    <button class="savebtn alt" id="ro-archive" style="text-align:left;margin-bottom:10px;">🗄 Archive — keep the full record (e.g. deceased / inactive), just hide it from active lists.</button>
    <button class="savebtn danger" id="ro-trash" style="text-align:left;">🗑 Move to Recycle Bin — restore later, or delete it forever.</button>
    <div class="mrow" style="margin-top:14px;"><button class="mbtn s" id="ro-cancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('ro-cancel').onclick=()=>m.remove();
  document.getElementById('ro-archive').onclick=()=>{m.remove();setContactStatus(id,'archived');};
  document.getElementById('ro-trash').onclick=()=>{m.remove();setContactStatus(id,'trashed');};
}
// Edit optional additional (custom) fields — quick-pick common ones or add your own.
function showEditFields(id){
  const d=getDonor(id);if(!d)return;
  const QUICK=['Yom Kippur Appeal','Kiddush Sponsor','Capital Campaign','Sefer Torah','Building Fund'];
  const rowHTML=(name,val)=>`<div class="ef-row"><input class="minp ef-name" placeholder="Field name" value="${esc(name||'')}"/><input class="minp ef-val" placeholder="Value (e.g. Yes, $500…)" value="${esc(val||'')}"/><button class="ef-del" title="Remove">×</button></div>`;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Additional Fields</div>
    <div class="msub">Optional info you track manually. These also come in from your Excel import.</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;">${QUICK.map(q=>`<button class="chip ef-quick" data-q="${esc(q)}">+ ${esc(q)}</button>`).join('')}</div>
    <div id="ef-rows">${Object.entries(d.custom||{}).map(([k,v])=>rowHTML(k,v)).join('')}</div>
    <button class="savebtn alt" id="ef-add" style="margin-top:4px;">+ Add your own field</button>
    <div class="mrow" style="margin-top:13px;"><button class="mbtn s" id="ef-cancel">Cancel</button><button class="mbtn p" id="ef-save">Save</button></div>
  </div>`;
  document.body.appendChild(m);
  const rows=m.querySelector('#ef-rows');
  const bindDel=()=>m.querySelectorAll('.ef-del').forEach(b=>b.onclick=()=>b.closest('.ef-row').remove());
  const addRow=(n,v)=>{rows.insertAdjacentHTML('beforeend',rowHTML(n,v));bindDel();const last=rows.lastElementChild;last.querySelector(v?'.ef-val':'.ef-name').focus();};
  bindDel();
  m.querySelectorAll('.ef-quick').forEach(b=>b.onclick=()=>addRow(b.dataset.q,''));
  m.querySelector('#ef-add').onclick=()=>addRow('','');
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  m.querySelector('#ef-cancel').onclick=()=>m.remove();
  m.querySelector('#ef-save').onclick=()=>{
    const custom={};
    m.querySelectorAll('.ef-row').forEach(r=>{const n=r.querySelector('.ef-name').value.trim();const v=r.querySelector('.ef-val').value.trim();if(n)custom[n]=v;});
    updateDonor(id,{custom});m.remove();render();
  };
}

const EMPTY_DETAIL='<div class="right-empty"><div><div class="re-icon">👈</div><div>Select a contact to view details</div></div></div>';

// ── MAIN RENDER ────────────────────────────────────────────────────
// Identifies "where" we are, so a re-render that stays put (e.g. editing a
// contact) can keep its scroll position instead of jumping to the top.
let lastRenderKey=null;
function renderKey(){const isD=window.innerWidth>=900;return view+'|'+(isD?(desktopDetailId||''):(detailId||''))+'|'+(isD?'d':'m');}
const SCROLLERS=['.right-panel','.left-scroll','.page'];
function render(){
  if(!currentUser){renderLogin();return;}
  const isDesktop=window.innerWidth>=900;
  // Preserve scroll only when re-rendering the same place (not on navigation).
  const samePlace=renderKey()===lastRenderKey;
  const saved={};
  if(samePlace){SCROLLERS.forEach(s=>{const el=document.querySelector(s);if(el)saved[s]=el.scrollTop;});saved.__win=window.scrollY;}
  let leftContent='',rightContent='';
  if(view==='dashboard')leftContent=renderDashboard();
  else if(view==='list')leftContent=renderList();
  else if(view==='tasks')leftContent=renderTasks();
  else if(view==='settings')leftContent=renderSettings();
  else if(view==='admin')leftContent=renderAdmin();
  else if(view==='detail'&&!isDesktop)leftContent=renderDetail();

  if(isDesktop&&(view==='list'||view==='detail')){
    leftContent=renderList();
    rightContent=desktopDetailId?renderDetail(desktopDetailId):EMPTY_DETAIL;
  }

  if(!(!isDesktop&&view==='detail'))leftContent=campaignSwitcherHTML()+leftContent;

  const nav=navHTML();
  const app=document.getElementById('app');
  if(isDesktop){
    if(view==='list'||view==='detail'){
      app.innerHTML=`<div class="shell">${nav}<div class="left-panel"><div class="left-scroll">${leftContent}</div></div><div class="right-panel">${rightContent}</div></div>`;
    } else {
      app.innerHTML=`<div class="shell">${nav}<div class="page">${leftContent}</div></div>`;
    }
  } else {
    app.innerHTML=`<div class="mobile">${leftContent}</div>${nav}`;
  }
  attachEvents();
  if(samePlace){SCROLLERS.forEach(s=>{const el=document.querySelector(s);if(el&&saved[s]!=null)el.scrollTop=saved[s];});if(saved.__win!=null)window.scrollTo(0,saved.__win);}
  lastRenderKey=renderKey();
}

function attachDonorEvents(){
  const isDesktop=window.innerWidth>=900;
  document.querySelectorAll('.drow[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(bulkMode){const id=el.dataset.id;const f=getFiltered();const idx=f.findIndex(d=>d.id===id);
        if(e.shiftKey&&lastBulkIdx!==null&&idx>=0){const a=Math.min(lastBulkIdx,idx),b=Math.max(lastBulkIdx,idx);for(let i=a;i<=b;i++)bulkSel.add(f[i].id);lastBulkIdx=idx;render();return;}
        bulkSel.has(id)?bulkSel.delete(id):bulkSel.add(id);lastBulkIdx=idx;
        const cbx=el.querySelector('.dcb');if(cbx){cbx.className='dcb'+(bulkSel.has(id)?' on':'');cbx.textContent=bulkSel.has(id)?'✓':'';}
        el.classList.toggle('bulk-on',bulkSel.has(id));
        const cnt=document.getElementById('bulk-count');if(cnt)cnt.textContent=bulkSel.size+' selected';
        const ba=document.getElementById('ba-btn');if(ba)ba.disabled=bulkSel.size===0;
        const bw=document.getElementById('bw-btn');if(bw)bw.disabled=bulkSel.size===0;
        const ball=document.getElementById('ball-btn');if(ball)ball.textContent=(bulkSel.size>=getFiltered().length&&getFiltered().length>0)?'Clear all':'Select all';
        return;}
      if(isDesktop){desktopDetailId=el.dataset.id;const rp=document.querySelector('.right-panel');if(rp){rp.innerHTML=renderDetail(desktopDetailId);attachEvents();rp.scrollTop=0;lastRenderKey=renderKey();}
        document.querySelectorAll('.drow').forEach(r=>r.classList.remove('selected-row'));el.classList.add('selected-row');}
      else{detailId=el.dataset.id;view='detail';render();}
    });
  });
}

    <div class="mfield"><label class="mlbl">Primary Phone</label><input class="minp" id="aph" type="tel"/></div>
    <div class="mfield"><label class="mlbl">Primary Email</label><input class="minp" id="ape" type="email"/></div>
    <div class="mfield"><label class="mlbl">Secondary Name</label><input class="minp" id="asn"/></div>
    <div class="mfield"><label class="mlbl">Secondary Phone</label><input class="minp" id="asp" type="tel"/></div>
    <div class="mfield"><label class="mlbl">City</label><input class="minp" id="acy"/></div>
    <div class="mfield"><label class="mlbl">Target Amount</label><input class="minp" id="atgt" type="number"/></div>
    <div class="mfield"><label class="mlbl">Tier</label><select class="msel" id="atier">${TIERS.map(t=>`<option value="${t}">${TIER_CFG[t].label}</option>`).join('')}</select></div>
    <div class="mrow"><button class="mbtn s" id="add-cancel">Cancel</button><button class="mbtn p" id="add-save">Add</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('add-cancel').onclick=()=>m.remove();
  document.getElementById('add-save').onclick=()=>{
    const name=document.getElementById('anm').value.trim();if(!name){alert('Name required.');return;}
    const tier=document.getElementById('atier').value;const td=settings.tierDefaults[tier];
    const c={name,pName:document.getElementById('apn').value.trim(),sName:document.getElementById('asn').value.trim(),pPhone:document.getElementById('aph').value.trim(),sPhone:document.getElementById('asp').value.trim(),pEmail:document.getElementById('ape').value.trim(),sEmail:'',city:document.getElementById('acy').value.trim(),state:'',street:'',zip:'',high:0,medium:0,low:0,actual:0,target:parseFloat(document.getElementById('atgt').value)||0,latestDonation:0,latestDate:'',largestDonation:0,notes:'',tier,years:{},custom:{},preArcStage:0,postArcStage:undefined,pledgeAmount:0,pledgePaid:0,pledgePlan:'',pledgePlanNote:'',payments:[],retailTarget:td.retail,wholesaleTarget:td.wholesale,interactions:[],tasks:[],campaignId:activeCampaignId};
    const btn=document.getElementById('add-save');btn.disabled=true;btn.textContent='Adding…';setStatus('saving');
    api('/contacts',{method:'POST',body:JSON.stringify(c)}).then(res=>{donors.push(res.contact);setStatus('saved');writeCache();m.remove();if(window.innerWidth>=900){desktopDetailId=res.contact.id;view='list';}render();})
      .catch(err=>{if(err.code===401)return;btn.disabled=false;btn.textContent='Add';alert('Could not add: '+err.message);});
  };
}

function showBulkModal(){
  const sel=[...bulkSel];const names=sel.map(id=>getDonor(id)?.name||'').filter(Boolean);
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Log Wholesale Touchpoint</div><div class="msub">${names.length} donors: ${esc(names.slice(0,3).join(', '))}${names.length>3?` +${names.length-3} more`:''}</div>
    <div class="mfield"><label class="mlbl">Type</label><select class="msel" id="bwt"><option>📄 Report</option><option>📰 Newsletter</option></select></div>
    <div class="mfield"><label class="mlbl">Date</label><input class="minp" id="bwd" type="date" value="${today()}"/></div>
    <div class="mfield"><label class="mlbl">Note</label><textarea class="mta" id="bwn" placeholder="e.g. Sent Q1 donor report"></textarea></div>
    <div class="mrow"><button class="mbtn s" id="bwcancel">Cancel</button><button class="mbtn p" id="bwsave">Save for All</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('bwcancel').onclick=()=>m.remove();
  document.getElementById('bwsave').onclick=()=>{const type=document.getElementById('bwt').value,date=document.getElementById('bwd').value,note=document.getElementById('bwn').value;sel.forEach(id=>{const d=getDonor(id);if(d)updateDonor(id,{interactions:[...(d.interactions||[]),{id:Date.now()+Math.random(),type,date,note}]});});m.remove();bulkMode=false;bulkSel.clear();render();};
}

function showBulkAssignModal(){
  const sel=[...bulkSel];if(!sel.length)return;
  const names=sel.map(id=>getDonor(id)?.name||'').filter(Boolean);
  const candidates=allUsers;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Assign Contacts</div>
    <div class="msub">${sel.length} contact${sel.length!==1?'s':''}: ${esc(names.slice(0,3).join(', '))}${names.length>3?` +${names.length-3} more`:''}</div>
    <div class="mfield"><label class="mlbl">Assign to teammate</label>
      <select class="msel" id="ba-user">${candidates.map(u=>`<option value="${u.id}">${esc(u.name||u.email)}${u.id===(currentUser&&currentUser.id)?' (you)':''}</option>`).join('')}</select></div>
    <div class="msub" style="font-size:12px;margin-top:-4px;">They'll be added as someone who can see and edit these contacts. Existing access is kept. (Only contacts you own or admin can reassign.)</div>
    <div class="mrow"><button class="mbtn s" id="ba-cancel">Cancel</button><button class="mbtn p" id="ba-save">Assign</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('ba-cancel').onclick=()=>m.remove();
  document.getElementById('ba-save').onclick=async()=>{
    const uid=document.getElementById('ba-user').value;if(!uid)return;
    const btn=document.getElementById('ba-save');btn.disabled=true;btn.textContent='Assigning…';
    let ok=0,skip=0,fail=0;
    for(const id of sel){
      const d=getDonor(id);if(!d){fail++;continue;}
      if(d.ownerId===uid||(d.assignedUserIds||[]).includes(uid)){skip++;continue;}
      const ids=Array.from(new Set([...(d.assignedUserIds||[]),uid]));
      try{const res=await api('/contacts/'+encodeURIComponent(id)+'/assign',{method:'PUT',body:JSON.stringify({assignedUserIds:ids})});
        const i=donors.findIndex(x=>x.id===id);if(i>=0)donors[i]=res.contact;ok++;}
      catch(e){if(e.code===401)return;fail++;}
    }
    m.remove();bulkMode=false;bulkSel.clear();writeCache();render();
    alert(`Assigned ${ok} contact${ok!==1?'s':''}.`+(skip?` ${skip} already had access.`:'')+(fail?` ${fail} couldn't be reassigned (you must own them or be an admin).`:''));
  };
}

function showAssignModal(contactId){
  const d=getDonor(contactId);if(!d)return;
  const sel=new Set(d.assignedUserIds||[]);
  const candidates=allUsers.filter(u=>u.id!==d.ownerId);
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Manage Access</div><div class="msub">Choose who can see and edit <b>${esc(d.name)}</b></div>
    <div class="assign-list" id="assign-list">${candidates.length?candidates.map(u=>`<div class="assign-item${sel.has(u.id)?' on':''}" data-uid="${u.id}"><div class="assign-check">✓</div><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:14px;">${esc(u.name||u.email)}</div><div style="font-size:12px;color:var(--text-3);">${esc(u.email||'')}</div></div></div>`).join(''):'<div style="color:var(--text-3);font-size:13px;padding:8px;">No other users yet. Add teammates in the Team tab.</div>'}</div>
    <div class="mrow"><button class="mbtn s" id="as-cancel">Cancel</button><button class="mbtn p" id="as-save">Save access</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  m.querySelectorAll('[data-uid]').forEach(it=>it.addEventListener('click',()=>{const id=it.dataset.uid;if(sel.has(id)){sel.delete(id);it.classList.remove('on');}else{sel.add(id);it.classList.add('on');}}));
  document.getElementById('as-cancel').onclick=()=>m.remove();
  document.getElementById('as-save').onclick=()=>{
    const ids=[...sel];const btn=document.getElementById('as-save');btn.disabled=true;btn.textContent='Saving…';
    api('/contacts/'+encodeURIComponent(contactId)+'/assign',{method:'PUT',body:JSON.stringify({assignedUserIds:ids})})
      .then(res=>{const i=donors.findIndex(x=>x.id===contactId);if(i>=0)donors[i]=res.contact;m.remove();render();})
      .catch(err=>{if(err.code===401)return;btn.disabled=false;btn.textContent='Save access';alert('Could not save: '+err.message);});
  };
}

function showUserModal(userId){
  const editing=userId?allUsers.find(u=>u.id===userId):null;
  const isMe=editing&&currentUser&&editing.id===currentUser.id;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">${editing?'Edit User':'Add User'}</div><div class="msub">${editing?esc(editing.email):'Create a login for a teammate'}</div>
    <div class="mfield"><label class="mlbl">Name</label><input class="minp" id="u-name" value="${editing?esc(editing.name||''):''}"/></div>
    ${editing?'':`<div class="mfield"><label class="mlbl">Email *</label><input class="minp" id="u-email" type="email"/></div>`}
    <div class="mfield"><label class="mlbl">${editing?'Reset Password (leave blank to keep)':'Password *'}</label><input class="minp" id="u-pass" type="text" autocomplete="new-password" placeholder="${editing?'••••••••':''}"/></div>
    <div class="mfield"><label class="mlbl">Role</label><select class="msel" id="u-role"><option value="user" ${editing&&editing.role==='user'?'selected':''}>User</option><option value="admin" ${editing&&editing.role==='admin'?'selected':''}>Admin</option></select></div>
    <div class="mrow"><button class="mbtn s" id="u-cancel">Cancel</button><button class="mbtn p" id="u-save">${editing?'Save':'Create'}</button></div>
    ${editing&&!isMe?`<button class="mbtn danger" id="u-delete" style="width:100%;margin-top:9px;">Delete user</button>`:''}
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('u-cancel').onclick=()=>m.remove();
  document.getElementById('u-save').onclick=()=>{
    const name=document.getElementById('u-name').value.trim();
    const pass=document.getElementById('u-pass').value;
    const role=document.getElementById('u-role').value;
    const btn=document.getElementById('u-save');btn.disabled=true;btn.textContent='Saving…';
    let p;
    if(editing){p=api('/users/'+editing.id,{method:'PUT',body:JSON.stringify({name,role,password:pass||undefined})});}
    else{const email=document.getElementById('u-email').value.trim();if(!email||!pass){alert('Email and password required.');btn.disabled=false;btn.textContent='Create';return;}p=api('/users',{method:'POST',body:JSON.stringify({name,email,password:pass,role})});}
    p.then(()=>refreshUsers()).then(()=>{m.remove();render();}).catch(err=>{if(err.code===401)return;btn.disabled=false;btn.textContent=editing?'Save':'Create';alert(err.message);});
  };
  document.getElementById('u-delete')?.addEventListener('click',()=>{
    if(!confirm('Delete this user? Contacts they own are kept; they will be unassigned from shared contacts.'))return;
    api('/users/'+editing.id,{method:'DELETE'}).then(()=>refreshUsers()).then(()=>{m.remove();render();}).catch(err=>{if(err.code!==401)alert(err.message);});
  });
}

function refreshUsers(){return api('/users').then(r=>{allUsers=r.users;});}

// ── AUTH FLOW ──────────────────────────────────────────────────────
function renderLogin(err){
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML=`<div class="login-wrap"><form class="login-card" id="login-form">
    <div class="login-logo">OT</div>
    <div class="login-title">Outreach Tracker</div>
    <div class="login-sub">Sign in to your account</div>
    ${err?`<div class="login-err">${esc(err)}</div>`:''}
    <label class="login-lbl">Email</label><input class="login-inp" id="login-email" type="email" autocomplete="username" autocapitalize="none" required/>
    <label class="login-lbl">Password</label><input class="login-inp" id="login-pass" type="password" autocomplete="current-password" required/>
    <button class="login-btn" type="submit">Sign in</button>
  </form></div>`;
  const f=document.getElementById('login-form');
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const email=document.getElementById('login-email').value.trim();
    const password=document.getElementById('login-pass').value;
    const btn=f.querySelector('.login-btn');btn.disabled=true;btn.textContent='Signing in…';
    try{
      const r=await api('/login',{method:'POST',body:JSON.stringify({email,password})});
      currentUser=r.user;await loadState();view='dashboard';render();
    }catch(e){
      renderLogin(e.code===401?'Invalid email or password':(e.message||'Sign-in failed'));
    }
  });
}

function doLogout(){
  api('/logout',{method:'POST'}).catch(()=>{}).then(()=>{currentUser=null;donors=[];allUsers=[];renderLogin();});
}

async function loadState(){
  const s=await api('/state');
  currentUser=s.me;allUsers=s.users||[];
  donors=s.contacts||[];
  settings=Object.assign(defaultSettings(),s.settings||{});
  campaigns=s.campaigns||[];
  activeCampaignId=(campaigns.find(c=>c.id===settings.defaultCampaignId)?settings.defaultCampaignId:(campaigns[0]&&campaigns[0].id))||null;
  dashState=s.dash||{day:'',doneCalls:[],streak:{date:'',count:0,lastGoal:0}};
  if(!dashState.streak)dashState.streak={date:'',count:0,lastGoal:0};
  if(!Array.isArray(dashState.doneCalls))dashState.doneCalls=[];
  writeCache();
}

async function boot(){
  try{
    const me=await api('/me');
    currentUser=me.user;
    await loadState();
    view='dashboard';render();
  }catch(e){
    if(e.code===401){return;/* renderLogin already shown by api() */}
    const cache=readCache();
    if(currentUser&&cache){donors=cache.donors||[];settings=Object.assign(defaultSettings(),cache.settings||{});dashState=cache.dashState||dashState;campaigns=cache.campaigns||[];activeCampaignId=cache.activeCampaignId||(campaigns[0]&&campaigns[0].id)||null;view='dashboard';render();setStatus('offline');}
    else{renderLogin('Could not reach the server. Please try again.');}
  }
}

let wasDesktopLayout=window.innerWidth>=900;
window.addEventListener('resize',()=>{
  const nowDesktop=window.innerWidth>=900;
  if(nowDesktop!==wasDesktopLayout){wasDesktopLayout=nowDesktop;if(currentUser)render();}
});
boot();
</script>
