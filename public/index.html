<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#4f46e5"/>
<title>Outreach Tracker</title>
<script>window.APP_BASE="%APP_BASE%";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet"/>

<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────────── */
:root{
  /* Palette is fully tokenised — re-skin the whole app by editing here. */
  --brand:#4f46e5; --brand-2:#6366f1; --brand-strong:#4338ca;
  --brand-soft:#eef0fe; --brand-soft-2:#e2e5fd;
  --emer:#0d9f6e; --emer-2:#10b981; --emer-soft:#e6f7f0;
  --amber:#d97706; --amber-soft:#fdf3e4;
  --violet:#7c3aed; --violet-soft:#f3eefe;
  --sky:#0284c7; --sky-soft:#e7f3fb;
  --red:#e11d48; --red-soft:#fdebef;

  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f4f5f9; --surface-3:#ecedf3;
  --border:#e7e8f0; --border-2:#d9dbe6;
  --text:#1b1f2a; --text-2:#586074; --text-3:#929aac; --faint:#c2c7d3;

  --hero-1:#4f46e5; --hero-2:#6d28d9;

  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(20,23,33,.05);
  --sh-2:0 1px 3px rgba(20,23,33,.06), 0 10px 24px -14px rgba(20,23,33,.18);
  --sh-3:0 24px 50px -20px rgba(20,23,33,.35);
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hebrew:'Frank Ruhl Libre','SBL Hebrew','Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{overflow-x:hidden;}
@media(max-width:899px){.mobile{max-width:100%;overflow-x:hidden;}.mobile .card{overflow-x:hidden;}}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;}
::selection{background:var(--brand-soft-2);}
#app{min-height:100%;}

/* ── APP SHELL (desktop) ───────────────────────────────────────── */
@media(min-width:900px){
  .shell{display:flex;height:100vh;overflow:hidden;}
  .page{flex:1;overflow-y:auto;background:var(--bg);}
  .page .hdr{position:sticky;top:0;z-index:10;}
  .page-inner,.dash,.sbody,.tsec{max-width:1040px;margin:0 auto;}
  .left-panel{width:452px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);}
  .left-scroll{flex:1;overflow-y:auto;}
  .right-panel{flex:1;overflow-y:auto;background:var(--surface-3);}
  .right-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-3);text-align:center;padding:40px;}
  .re-icon{font-size:46px;margin-bottom:14px;}
  .dbody{max-width:760px;margin:0 auto;padding:16px 22px 46px;}
  .dhdr{position:sticky;top:0;z-index:5;padding:12px 18px;}
  /* Lift cards off the panel so the detail view reads with structure, not a wash of
     white — and keep desktop compact (tighter padding/spacing than mobile). */
  .right-panel .card{box-shadow:var(--sh-2);border-color:var(--border-2);padding:13px 15px;margin-bottom:10px;}
  .right-panel .ctitle{margin-bottom:9px;}
}
@media(max-width:899px){
  .mobile{padding-bottom:74px;}
  .greenbox{padding:8px 11px;font-size:13px;font-weight:700;background:transparent;color:var(--brand);align-self:center;}
}

/* ── SIDEBAR / BOTTOM NAV ──────────────────────────────────────── */
.nav{display:flex;background:var(--surface);}
.nav-brand,.nav-foot{display:none;}
.nav-items{display:flex;flex:1;}
.nav-btn{flex:1;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:10px;font-weight:600;transition:color .15s,background .15s;border-radius:10px;}
.nav-btn.active{color:var(--brand);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{display:flex;align-items:center;gap:3px;letter-spacing:.2px;}
.badge{background:var(--red);color:#fff;border-radius:var(--r-pill);padding:0 5px;font-size:9px;font-weight:700;line-height:15px;min-width:15px;text-align:center;}
@media(max-width:899px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));box-shadow:0 -1px 14px rgba(20,23,33,.06);}
}
@media(min-width:900px){
  .nav{flex-direction:column;width:248px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 14px;gap:4px;}
  .nav-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;}
  .nav-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;box-shadow:var(--sh-2);}
  .nav-brand-title{font-size:16px;font-weight:800;letter-spacing:-.3px;}
  .nav-brand-sub{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .nav-items{flex-direction:column;flex:0;gap:3px;}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--text-2);width:100%;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--brand-soft);color:var(--brand);}
  .nav-btn .nav-icon{font-size:18px;}
  .nav-foot{display:block;margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
  .nav-user{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;}
  .nav-user-av{width:34px;height:34px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-user-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .nav-user-role{font-size:11px;color:var(--text-3);text-transform:capitalize;}
  .nav-logout{width:100%;padding:9px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600;transition:background .15s;}
  .nav-logout:hover{background:var(--surface-3);color:var(--text);}
}

/* ── PAGE HEADER ───────────────────────────────────────────────── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px 16px;}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.hdr-top:last-child{margin-bottom:0;}
.hdr-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.hdr-sub{font-size:12.5px;color:var(--text-3);margin-top:3px;font-weight:500;}
.hdr-btns{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.hbtn{padding:8px 13px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-2);font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;}
.hbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
.hbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.hbtn.primary:hover{background:var(--brand-strong);color:#fff;}
.hbtn.bulk-toggle{background:var(--amber);border-color:var(--amber);color:#fff;}
.hbtn.bulk-toggle:hover{background:#b45e04;border-color:#b45e04;color:#fff;}
.hbtn.bulk-toggle.on{background:var(--surface);border-color:var(--amber);color:var(--amber);}
.drow.compact{padding:11px 14px;align-items:center;user-select:none;-webkit-user-select:none;}
.drow.compact.bulk-on{background:var(--brand-soft);border-left-color:var(--brand);}

/* ── PROGRESS BARS ─────────────────────────────────────────────── */
.pbars{display:grid;gap:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;}
@media(min-width:560px){.pbars{grid-template-columns:1fr 1fr;}}
.pbar{min-width:0;}
.pbar-lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px;font-weight:600;color:var(--text-2);}
.pbar-lbl span:last-child{color:var(--text);font-variant-numeric:tabular-nums;}
.pbar-bg{background:var(--surface-3);border-radius:var(--r-pill);height:8px;overflow:hidden;}
.pbar-fill{border-radius:var(--r-pill);height:8px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.pbar-hebrew{font-size:13px;color:var(--text-3);text-align:right;margin-top:5px;direction:rtl;font-family:var(--hebrew);}

/* ── SEGMENTED TABS ────────────────────────────────────────────── */
.tab-toggle{display:flex;border-radius:var(--r-sm);border:1px solid var(--border);padding:3px;gap:3px;background:var(--surface-2);}
.tab-btn{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;font-weight:700;transition:all .18s;color:var(--text-2);}
.tab-btn.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1);}
.tab-btn.off:hover{color:var(--text);}

/* ── SEARCH ────────────────────────────────────────────────────── */
.sbar{padding:13px 16px 9px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9;}
.sinput{width:100%;padding:10px 13px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;transition:all .15s;}
.sinput:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.frow{display:flex;flex-wrap:wrap;gap:7px;padding:9px 0 3px;align-items:center;}
.fchip{padding:6px 12px;border-radius:var(--r-pill);border:1.5px solid var(--border);white-space:nowrap;font-size:12px;font-weight:600;background:var(--surface);color:var(--text-2);flex-shrink:0;transition:all .15s;}
.fchip:hover{border-color:var(--brand);color:var(--brand);}
.fchip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.ssel{margin-left:auto;padding:6px 9px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);font-size:12px;background:var(--surface);color:var(--text-2);flex-shrink:0;font-weight:600;}

/* ── DONOR ROW ─────────────────────────────────────────────────── */
.drow{background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--border);border-left:3px solid transparent;display:flex;align-items:flex-start;gap:12px;transition:background .14s,border-color .14s;cursor:pointer;}
.drow:hover{background:var(--surface-2);}
.drow.touched{border-left-color:var(--brand-soft-2);}
.drow.overdue{border-left-color:var(--red);}
.drow.fulfilled{border-left-color:var(--emer);}
.drow.selected-row{background:var(--brand-soft);border-left-color:var(--brand);}
.dcb{width:24px;height:24px;border-radius:7px;border:2px solid var(--border-2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;}
.dcb.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.dmain{flex:1;min-width:0;}
.dname{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
.dmeta{font-size:12px;color:var(--text-3);margin-top:3px;}
.dlast{font-size:12px;color:var(--text-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dright{text-align:right;flex-shrink:0;}
.damt{font-weight:800;font-size:15px;color:var(--emer);font-variant-numeric:tabular-nums;}
.dtargets{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.2;font-variant-numeric:tabular-nums;}
.dt{font-size:11.5px;font-weight:800;white-space:nowrap;}
.dt i{font-style:normal;font-size:8.5px;font-weight:700;color:var(--text-3);margin-right:4px;letter-spacing:.3px;}
.dt-h{color:var(--emer);}
.dt-m{color:var(--amber);}
.dt-l{color:var(--brand);}
.dwas{font-size:10px;color:var(--faint);margin-top:1px;}
.mbars{margin-top:8px;}
.mbar-bg{background:var(--surface-3);border-radius:var(--r-pill);height:4px;margin-bottom:3px;overflow:hidden;}
.mbar-fill{border-radius:var(--r-pill);height:4px;transition:width .5s;}
.mbar-lbl{font-size:9.5px;color:var(--text-3);display:flex;gap:10px;font-weight:700;}

/* ── BULK BAR ──────────────────────────────────────────────────── */
.bulkbar{background:var(--brand);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
.bulkbar button{padding:6px 13px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;transition:all .15s;}
.bulkbar button:hover:not(:disabled){background:rgba(255,255,255,.26);}
.bulkbar button:disabled{opacity:.45;cursor:not-allowed;}
.bulkbar button.primary{background:#fff;color:var(--brand);border-color:#fff;}

/* ── DETAIL HEADER ─────────────────────────────────────────────── */
.dhdr{background:var(--surface);border-bottom:1px solid var(--border);padding:15px 18px;display:flex;align-items:center;gap:12px;}
.backbtn{color:var(--text-2);font-size:26px;line-height:1;flex-shrink:0;transition:transform .15s,color .15s;}
.backbtn:active{transform:translateX(-2px);}
.dh-main{flex:1;min-width:0;}
.dhtitle{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.3px;}
.dhsub{font-size:12px;color:var(--text-3);margin-top:2px;}
.tier-badge{font-size:11px;padding:4px 10px;border-radius:var(--r-pill);font-weight:700;flex-shrink:0;}
.dbody{padding:16px;padding-bottom:96px;}

/* ── CARDS ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:13px;box-shadow:var(--sh-1);}
.ctitle{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;}
.chead{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:5px 7px;margin:-5px -7px 9px;border-radius:9px;transition:background .12s;}
.chead:hover{background:var(--surface-2);}
.chead-t{flex:1;}
.chead-x{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.coll-chev{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;padding:4px 11px;border-radius:999px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;line-height:1;white-space:nowrap;}
.chead:hover .coll-chev{background:var(--brand-strong);}
.card.collapsed .chead{margin-bottom:-5px;}
.card.collapsed .cbody{display:none;}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center;margin-bottom:12px;}
.tcell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 3px;}
.tlbl{font-size:9.5px;color:var(--text-3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.tval{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.tval-inp{width:100%;border:none;border-bottom:1px dashed var(--border-2);background:transparent;text-align:center;font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;padding:1px 0;appearance:textfield;-moz-appearance:textfield;}
.tval-inp::-webkit-outer-spin-button,.tval-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tval-inp:focus{outline:none;color:var(--brand);border-bottom-color:var(--brand);}
.r2{display:flex;gap:9px;margin-top:7px;}
.inp{flex:1;min-width:0;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;transition:all .15s;}
.inp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.greenbox{padding:10px 14px;background:var(--brand-soft);border-radius:var(--r-sm);font-weight:800;color:var(--brand);display:flex;align-items:center;white-space:nowrap;}
.clink{display:block;width:fit-content;max-width:100%;color:var(--brand);font-weight:600;text-decoration:none;margin-bottom:2px;padding:5px 0;transition:color .15s;user-select:text;-webkit-user-select:text;}
.clink:hover{color:var(--brand-strong);}
.nbox{margin-top:10px;padding:11px 13px;background:var(--amber-soft);border:1px solid #f6e2bf;border-radius:var(--r-sm);font-size:13px;color:#7a5212;line-height:1.5;}
.camp-switch{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
.camp-ico{font-size:15px;flex-shrink:0;}
.camp-switch select{flex:1;min-width:0;padding:8px 10px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);font-size:14px;font-weight:700;color:var(--text);outline:none;}
.camp-btn{flex-shrink:0;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;}
.camp-btn:active{transform:scale(.96);}
.camp-btn.danger{color:var(--red);border-color:#f3c9c9;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:var(--r-pill);border:1.5px solid var(--border);font-size:12px;background:var(--surface);color:var(--text-2);white-space:nowrap;font-weight:600;transition:all .15s;}
.chip:hover{border-color:var(--brand);color:var(--brand);}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cf-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;}
.cf-lbl{font-size:9.5px;color:var(--text-3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.cf-val{font-size:13px;color:var(--text);font-weight:600;}
.coll-toggle{width:100%;text-align:left;font-size:13px;color:var(--brand);padding:5px 0;font-weight:600;}
.subhd{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field-lbl{font-size:11px;color:var(--text-3);font-weight:600;display:block;margin-bottom:4px;}

/* ── ACCESS CARD ───────────────────────────────────────────────── */
.access-row{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.access-lbl{width:90px;flex-shrink:0;color:var(--text-3);font-weight:600;}
.access-val{flex:1;font-weight:600;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.chip-sm{background:var(--brand-soft);color:var(--brand);border-radius:var(--r-pill);padding:3px 10px;font-size:11.5px;font-weight:700;}

/* ── ARC ───────────────────────────────────────────────────────── */
.arc{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;margin:6px 0 8px;}
.arc::-webkit-scrollbar{display:none;}
.astep{display:flex;flex-direction:column;align-items:center;flex:1;min-width:48px;}
.adot{width:25px;height:25px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
.adot.done{background:var(--brand);border-color:var(--brand);color:#fff;}
.adot.cur{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700;transform:scale(1.16);box-shadow:0 2px 8px var(--brand-soft-2);}
.albl{font-size:9px;color:var(--text-3);margin-top:5px;text-align:center;line-height:1.25;max-width:54px;font-weight:600;}
.albl.done{color:var(--brand);}
.aline{height:2px;background:var(--border-2);flex:1;margin-bottom:15px;min-width:6px;transition:background .3s;}
.aline.done{background:var(--brand);}

/* ── PLEDGE ────────────────────────────────────────────────────── */
.pledge-box{background:var(--emer-soft);border:1px solid #c6ecdb;border-radius:var(--r-sm);padding:14px;margin-top:9px;}
.pledge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600;}
.pay-plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;}
.pay-chip{padding:9px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:12px;text-align:center;background:var(--surface);color:var(--text-2);font-weight:600;transition:all .15s;}
.pay-chip:hover{border-color:var(--emer);}
.pay-chip.on{background:var(--emer);color:#fff;border-color:var(--emer);}
.payment-log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.payment-log-item:last-child{border-bottom:none;}

/* ── TP BARS ───────────────────────────────────────────────────── */
.tp-bar{margin-bottom:11px;}
.tp-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:600;}
.tp-bg{background:var(--surface-3);border-radius:var(--r-pill);height:7px;overflow:hidden;}
.tp-fill{border-radius:var(--r-pill);height:7px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.tp-adj-row{display:flex;align-items:center;gap:8px;margin-top:5px;}
.tadj{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-2);background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all .15s;}
.tadj:hover{border-color:var(--brand);color:var(--brand);}
.tadj:active{transform:scale(.92);}
.tcnt{font-size:15px;font-weight:800;color:var(--text);min-width:22px;text-align:center;}

/* ── LOG / BUTTONS ─────────────────────────────────────────────── */
.logta{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);resize:vertical;min-height:66px;background:var(--surface-2);outline:none;transition:all .15s;line-height:1.5;}
.logta:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.savebtn{width:100%;padding:12px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-size:15px;font-weight:700;transition:all .15s;box-shadow:var(--sh-1);}
.savebtn:hover{background:var(--brand-strong);box-shadow:var(--sh-2);}
.savebtn:active{transform:translateY(1px);}
.savebtn.alt{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border-2);}
.savebtn.alt:hover{background:var(--surface-3);color:var(--text);}
.savebtn.danger{background:var(--red-soft);color:var(--red);border:1px solid #f3c9c9;box-shadow:none;}
.savebtn.danger:hover{background:#fbdce1;}
.micbtn{padding:9px 11px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.micbtn:hover{border-color:var(--brand);}
.micbtn.on{background:var(--red-soft);border-color:var(--red);animation:micpulse 1.1s ease-in-out infinite;}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.4);}50%{box-shadow:0 0 0 6px rgba(225,29,72,0);}}
.btn-ghost{padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:600;transition:all .15s;}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}

/* ── TASKS ─────────────────────────────────────────────────────── */
.titem{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.titem:last-child{border-bottom:none;}
.tchk{width:23px;height:23px;border-radius:50%;border:2px solid var(--border-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s;cursor:pointer;}
.tchk:hover{border-color:var(--emer);}
.tchk.done{background:var(--emer);border-color:var(--emer);color:#fff;}
.ttxt{flex:1;font-size:13.5px;color:var(--text);line-height:1.45;cursor:pointer;}
.tby{font-size:11px;color:var(--text-3);margin-top:3px;font-weight:600;}
.tdue{font-size:11px;margin-top:3px;font-weight:700;}
.tdue.overdue{color:var(--red);}
.tdue.today{color:var(--amber);}
.tdue.upcoming{color:var(--text-3);}
.tdel{color:var(--faint);font-size:20px;line-height:1;transition:color .15s;}
.tdel:hover{color:var(--red);}
.tacts{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.tdate-inp{font-size:11px;padding:3px 5px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text-2);font-family:inherit;max-width:132px;}

/* ── HISTORY ───────────────────────────────────────────────────── */
.hint{border-left:3px solid var(--brand-soft-2);padding-left:13px;margin-bottom:13px;}
.hhdr{display:flex;justify-content:space-between;align-items:flex-start;}
.htype{font-weight:700;font-size:13px;color:var(--text);}
.hdate{font-size:11px;color:var(--text-3);margin-left:7px;}
.hnote{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.5;}
.hdel{color:var(--faint);font-size:19px;line-height:1;transition:color .15s;}
.hdel:hover{color:var(--red);}
.hactions{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.hedit{font-size:13px;line-height:1;opacity:.5;transition:opacity .15s;}
.hedit:hover{opacity:1;}
.bin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.bin-row:last-child{border-bottom:none;}
.bin-name{font-weight:600;font-size:14px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bin-name:hover{color:var(--brand);}
.bin-actions{display:flex;gap:8px;flex-shrink:0;}
.bin-empty{font-size:13px;color:var(--text-3);}
.bin-scroll{max-height:300px;overflow:auto;}
.danger-chip{color:var(--red);border-color:#f3c9c9;}
.chai-toggle{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text-2);cursor:pointer;line-height:1.4;}
.chai-toggle input{margin-top:2px;width:16px;height:16px;flex-shrink:0;accent-color:var(--brand);}
.chai-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);white-space:nowrap;margin-right:6px;}
.ef-row{display:flex;gap:6px;align-items:center;margin-bottom:7px;}
.ef-row .ef-name,.ef-row .ef-val{flex:1;min-width:0;}
.ef-del{color:var(--faint);font-size:20px;line-height:1;flex-shrink:0;padding:0 4px;}
.ef-del:hover{color:var(--red);}
.hspouse{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);background:var(--sky-soft);color:var(--sky);margin-left:6px;font-weight:700;}

/* ── SETTINGS / ADMIN BODY ─────────────────────────────────────── */
.sbody{padding:16px;padding-bottom:96px;}
.shead{font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 10px;}
.shead:first-child{margin-top:4px;}
.admin-note{background:var(--brand-soft);border:1px solid var(--brand-soft-2);border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;color:var(--brand-strong);margin-bottom:14px;line-height:1.5;}
.admin-user-row{display:flex;align-items:center;gap:12px;padding:13px 14px;}
.au-av{width:38px;height:38px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.au-meta{flex:1;min-width:0;}
.au-name{font-size:14px;font-weight:700;}
.au-you{font-size:10px;color:var(--text-3);font-weight:600;}
.au-email{font-size:12px;color:var(--text-3);}
.au-role{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--text-2);text-transform:capitalize;}
.au-role.admin{background:var(--violet-soft);color:var(--violet);}

/* ── MODAL ─────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(20,23,33,.5);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-end;animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.sheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 18px 30px;width:100%;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-3);animation:sheetup .28s cubic-bezier(.2,.8,.2,1);}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
@media(min-width:900px){.overlay{align-items:center;}.sheet{border-radius:var(--r-lg);max-width:520px;}}
.mtitle{font-size:19px;font-weight:800;color:var(--text);margin-bottom:3px;letter-spacing:-.3px;}
.msub{font-size:13px;color:var(--text-3);margin-bottom:18px;}
.mfield{margin-bottom:14px;}
.mlbl{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block;}
.minp,.mta,.msel{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;transition:all .15s;}
.minp:focus,.mta:focus,.msel:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.mta{resize:vertical;min-height:66px;}
.mrow{display:flex;gap:9px;margin-top:8px;}
.mbtn{flex:1;padding:12px;border-radius:var(--r-sm);font-size:15px;font-weight:700;transition:all .14s;}
.mbtn:active{transform:translateY(1px);}
.mbtn.p{background:var(--brand);color:#fff;}
.mbtn.p:hover{background:var(--brand-strong);}
.mbtn.s{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border-2);}
.mbtn.s:hover{background:var(--surface-3);}
.mbtn.danger{background:var(--red-soft);color:var(--red);}
.assign-list{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow-y:auto;margin-bottom:6px;}
.assign-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;transition:all .14s;}
.assign-item:hover{border-color:var(--brand);}
.assign-item.on{background:var(--brand-soft);border-color:var(--brand);}
.assign-check{width:21px;height:21px;border-radius:6px;border:2px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex-shrink:0;}
.assign-item.on .assign-check{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ── EMPTY ─────────────────────────────────────────────────────── */
.empty{text-align:center;padding:56px 24px;color:var(--text-3);}
.empty-icon{font-size:42px;margin-bottom:14px;opacity:.9;}
.empty-txt{font-size:14px;line-height:1.6;color:var(--text-2);}
.empty-link{color:var(--brand);text-decoration:underline;font-weight:600;}

/* ── TASKS TAB ─────────────────────────────────────────────────── */
.tsec{padding:16px;padding-bottom:96px;}
.tsec h3{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 4px;}
.tsec h3:first-child{margin-top:0;}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-1);padding:4px 16px;margin-bottom:8px;}

/* ── DASHBOARD ─────────────────────────────────────────────────── */
.dash{padding:20px;padding-bottom:96px;}
.greeting{font-size:24px;font-weight:800;color:var(--text);margin-bottom:2px;letter-spacing:-.6px;}
.greeting-sub{font-size:13px;color:var(--text-3);margin-bottom:18px;}
.goal-card{background:linear-gradient(145deg,var(--hero-1) 0%,var(--hero-2) 100%);color:#fff;border-radius:var(--r-lg);padding:22px;margin-bottom:18px;display:flex;align-items:center;gap:20px;box-shadow:var(--sh-2);position:relative;overflow:hidden;}
.goal-card::before{content:'';position:absolute;top:-40%;right:-8%;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);pointer-events:none;}
.ring-wrap{flex-shrink:0;position:relative;width:92px;height:92px;}
.ring-svg{transform:rotate(-90deg);}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;}
.goal-info{flex:1;min-width:0;}
.goal-label{font-size:11.5px;opacity:.78;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;}
.goal-big{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.goal-sub{font-size:13px;opacity:.85;margin-top:5px;}
.streak{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-pill);padding:4px 12px;font-size:12px;margin-top:10px;font-weight:600;}
.goal-picker,.sort-picker{display:flex;align-items:center;gap:9px;margin-top:11px;}
.goal-picker label,.sort-picker label{font-size:12px;opacity:.82;}
.goal-picker input{width:60px;padding:6px 9px;border-radius:var(--r-sm);border:none;font-weight:700;text-align:center;background:rgba(255,255,255,.2);color:#fff;outline:none;}
.sort-picker select{padding:5px 9px;border-radius:var(--r-sm);border:none;font-size:12px;background:rgba(255,255,255,.2);color:#fff;font-family:inherit;outline:none;}
.sort-picker select option{color:var(--text);}
.list-head{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;}
.call-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;margin-bottom:10px;box-shadow:var(--sh-1);display:flex;gap:13px;align-items:flex-start;transition:box-shadow .18s,transform .12s;}
.call-card:hover{box-shadow:var(--sh-2);}
.call-card.done-card{opacity:.55;}
.call-info{flex:1;min-width:0;}
.call-name{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
.call-meta{font-size:12px;color:var(--text-3);margin-top:3px;}
.call-phone{margin-top:6px;display:inline-block;color:var(--brand);font-size:13px;text-decoration:none;font-weight:600;}
.call-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.done-btn{padding:9px 17px;background:var(--brand);color:#fff;border-radius:var(--r-pill);font-size:13px;font-weight:700;white-space:nowrap;transition:all .15s;}
.done-btn:hover{background:var(--brand-strong);}
.done-btn:active{transform:scale(.96);}
.done-btn.completed{background:var(--emer-soft);color:var(--emer);}
.open-btn{font-size:12px;color:var(--brand);text-decoration:none;font-weight:600;}
.open-btn:hover{text-decoration:underline;}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:300;}
.confetti-piece{position:absolute;width:9px;height:9px;border-radius:2px;animation:confetti-fall 1.3s ease-out forwards;}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(220px) rotate(720deg);}}
.cheer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border-radius:var(--r-lg);padding:24px 32px;text-align:center;box-shadow:var(--sh-3);z-index:400;animation:pop-in .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop-in{0%{transform:translate(-50%,-50%) scale(.7);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.cheer-emoji{font-size:44px;margin-bottom:8px;}
.cheer-msg{font-size:18px;font-weight:700;color:var(--text);margin-bottom:5px;}
.cheer-sub{font-size:13px;color:var(--text-3);}
.fu-prompt{margin-top:12px;padding:13px;background:var(--brand-soft);border-radius:var(--r-sm);border:1px solid var(--brand-soft-2);}
.fu-prompt-txt{font-size:13px;color:var(--brand-strong);margin-bottom:9px;font-weight:600;}
.fu-prompt-row{display:flex;gap:9px;}
.fu-prompt-row button{flex:1;padding:9px;border-radius:var(--r-sm);font-size:13px;font-weight:700;transition:filter .15s;}
.fu-prompt-row button:hover{filter:brightness(.97);}

/* ── LOGIN ─────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%, #eef0fe, var(--bg) 60%);}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 28px;box-shadow:var(--sh-2);display:flex;flex-direction:column;}
.login-logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;margin:0 auto 16px;box-shadow:var(--sh-2);}
.login-title{font-size:22px;font-weight:800;text-align:center;letter-spacing:-.4px;}
.login-sub{font-size:13px;color:var(--text-3);text-align:center;margin-bottom:22px;}
.login-lbl{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.login-inp{width:100%;padding:12px 13px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface-2);outline:none;margin-bottom:15px;transition:all .15s;}
.login-inp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
.login-btn{width:100%;padding:13px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-size:15px;font-weight:700;transition:all .15s;margin-top:4px;}
.login-btn:hover{background:var(--brand-strong);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{background:var(--red-soft);color:var(--red);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:16px;text-align:center;}

/* ── SYNC PILL ─────────────────────────────────────────────────── */
.sync-pill{position:fixed;bottom:88px;right:16px;z-index:120;padding:7px 14px;border-radius:var(--r-pill);font-size:12px;font-weight:700;box-shadow:var(--sh-2);opacity:0;transition:opacity .25s;pointer-events:none;}
.sync-pill.saving{opacity:1;background:var(--surface);color:var(--text-2);border:1px solid var(--border-2);}
.sync-pill.offline{opacity:1;background:var(--amber-soft);color:var(--amber);border:1px solid #f2d49a;}
.sync-pill.saved{opacity:0;background:var(--emer-soft);color:var(--emer);}
@media(min-width:900px){.sync-pill{bottom:18px;}}

/* ── IMPORT REPORT ─────────────────────────────────────────────── */
.imp-list{max-height:46vh;overflow-y:auto;margin:6px 0 4px;border:1px solid var(--border);border-radius:var(--r-sm);}
.imp-row{padding:9px 12px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;}
.imp-row:last-child{border-bottom:none;}
.imp-row.error{background:var(--red-soft);}
.imp-row.warning{background:var(--amber-soft);}
.imp-rn{font-size:12px;font-weight:700;color:var(--text-3);white-space:nowrap;}
.imp-nm{font-weight:600;font-size:14px;}
.imp-msg{grid-column:2;font-size:13px;color:var(--text-2);}
.imp-row.error .imp-msg{color:var(--red);}
.imp-row.warning .imp-msg{color:var(--amber);}
/* ── IMPORT WIZARD ─────────────────────────────────────────────── */
.imp-map{max-height:38vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);}
.imp-maprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border);font-size:13px;}
.imp-maprow:last-child{border-bottom:none;}
.imp-col{flex:1;min-width:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.imp-arrow{color:var(--text-3);flex-shrink:0;}
.imp-fld{flex:0 0 auto;font-weight:700;color:var(--brand);text-align:right;}
.imp-extra{font-size:12.5px;color:var(--text-2);line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;}
.iw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px;}
.iw-list{max-height:42vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);}
.iw-pick{display:flex;align-items:center;gap:10px;padding:8px 11px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;}
.iw-pick:last-child{border-bottom:none;}
.iw-pick input{width:17px;height:17px;flex-shrink:0;accent-color:var(--brand);}
.iw-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}

<body>
<div id="app"></div>
<div id="sync-pill" class="sync-pill"></div>
<script>
// ── CONSTANTS ─────────────────────────────────────────────────────
const TIERS=['star','major','mid','general'];
const TIER_SHORT={star:'⭐ Top',major:'🥇 Major',mid:'🥈 Mid',general:'🥉 Gen'};
const TIER_CFG={
  star:{label:'⭐ Top Future',bg:'#f3eefe',color:'#7c3aed'},
  major:{label:'🥇 Major',bg:'#fdf2e3',color:'#b45309'},
  mid:{label:'🥈 Mid',bg:'#e7f3fb',color:'#0369a1'},
  general:{label:'🥉 General',bg:'#eef0f4',color:'#64748b'}
};
// Shown when a contact has no tier yet (we never auto-assign one).
const TIER_NONE={label:'No tier',bg:'#eef0f4',color:'#94a3b8'};
const PRE_ARC=['Not Contacted','Reached Out','Had Conversation','Thinking It Over','Pledged','Donated'];
const POST_ARC=['Thanked','Report Sent','Personal Touch','Event Invited','Ready for Next Ask'];
const INT_TYPES=['📞 Call','💬 Text','📧 Email','🤝 Meeting','📮 Voicemail','📝 Other','📄 Report','📰 Newsletter'];
const PAY_PLANS=['Monthly','Quarterly','Yearly','One-time','Specific Date','Custom'];
const KNOWN_COLS=new Set(['Name','Household: Account ID','Account ID','Account Phone','High','Medium','Low','Actual','Amb.','Tier','Latest Donation ','Latest Donation','Latest Donation Date','Largest Donation','Snapshot: Latest Donation','Snapshot: Latest Donation Date','Snapshot: Largest Donation','Snapshot: YTD donation summary','Snapshot: Last Year donation summary','Snapshot: 2 Years ago donation summary','Snapshot: 3 Years ago donation summary','Snapshot: 4 Years ago donation summary','2025','2024','2023','2022','2021','Primary Contact: Name','Primary Contact: Contact ID','Secondary Contact: Name','Secondary Contact: Contact ID','Primary Contact: Email','Primary Contact: Mobile Phone','Secondary Contact: Email','Secondary Contact: Mobile Phone','Primary Contact: Personal Notes','Primary Contact: Notes','Primary Contact: Description','Secondary Contact: Personal Notes','Secondary Contact: Notes','Secondary Contact: Description','Primary Contact: Deceased','Secondary Contact: Deceased','Primary  Last Activity','Primary Last Activity','Street','City','State','Postal Code','Event (Primary Contact)',' Event Date (Primary Contact)','Event (Secondary Contact)','Event Date (Secondary Contact)','Capitol Campaign','YK Appeal','Chai Club? - included in total. Not done for everyone','Kiddush Sponsor']);
const CHEERS=['Great work! Keep going! 💪','You\'re on fire! 🔥','Every call counts! ✨','Making a difference! 🌟','That\'s what it\'s about! 🙌','Yasher koach! 🏆','Keep the momentum! 🚀','One step closer! ⭐'];
const HEBREW_RESULT='לא עליך המלאכה לגמור';
const HEBREW_EFFORT='ולא אתה בן חורין להבטל ממנה';

// ── PERSISTENCE / API ─────────────────────────────────────────────
let APP_BASE=window.APP_BASE||''; if(APP_BASE.indexOf('%')>-1)APP_BASE='';
function defaultSettings(){return{tierDefaults:{star:{retail:4,wholesale:4},major:{retail:3,wholesale:4},mid:{retail:2,wholesale:4},general:{retail:1,wholesale:4}},dailyGoal:10,dashSort:'tier',campaignGoals:{}};}

function api(path,opts){
  return fetch(APP_BASE+'/api'+path,Object.assign({headers:{'Content-Type':'application/json'},credentials:'same-origin'},opts||{}))
    .then(async r=>{
      if(r.status===401){currentUser=null;renderLogin();const e=new Error('unauthorized');e.code=401;throw e;}
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
      return data;
    });
}

// ── STATE ─────────────────────────────────────────────────────────
let currentUser=null, allUsers=[], sfConnected=false;
let donors=[], settings=defaultSettings();
let campaigns=[], activeCampaignId=null;
let dashState={day:'',doneCalls:[],streak:{date:'',count:0,lastGoal:0}};
let view='dashboard',detailId=null,listTab='courting',planSort='tier',taskTab='followups';
let searchVal='',filterVal='All',sortVal='target';
let bulkMode=false,bulkSel=new Set(),lastBulkIdx=null;
let logType=INT_TYPES[0],logSpouse='Primary';
let micActive=false,micTarget=null,recognition=null;
let desktopDetailId=null;

// ── SYNC QUEUE ─────────────────────────────────────────────────────
const dirtyContacts=new Set();
let settingsDirty=false, dashDirty=false, flushTimer=null;
function setStatus(s){const el=document.getElementById('sync-pill');if(!el)return;el.className='sync-pill '+s;el.textContent=s==='saving'?'Saving…':s==='offline'?'Offline — will retry':'Saved';}
function scheduleFlush(){setStatus('saving');if(flushTimer)clearTimeout(flushTimer);flushTimer=setTimeout(flush,500);}
function markContact(id){dirtyContacts.add(id);scheduleFlush();}
function markSettings(){settingsDirty=true;scheduleFlush();}
function markDash(){dashDirty=true;scheduleFlush();}
async function flush(){
  flushTimer=null;
  try{
    for(const id of [...dirtyContacts]){
      const c=getDonor(id);
      if(c)await api('/contacts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(c)});
      dirtyContacts.delete(id);
    }
    if(settingsDirty){await api('/settings',{method:'PUT',body:JSON.stringify(settings)});settingsDirty=false;}
    if(dashDirty){await api('/dash',{method:'PUT',body:JSON.stringify(dashState)});dashDirty=false;}
    setStatus('saved');writeCache();
  }catch(e){
    if(e.code===401)return;
    setStatus('offline');writeCache();
    setTimeout(()=>{if(dirtyContacts.size||settingsDirty||dashDirty)flush();},5000);
  }
}
window.addEventListener('online',()=>{if(dirtyContacts.size||settingsDirty||dashDirty)flush();});

// ── OFFLINE CACHE ──────────────────────────────────────────────────
function cacheKey(){return 'ot_cache_'+(currentUser?currentUser.id:'anon');}
function writeCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({donors,settings,dashState,campaigns,activeCampaignId}));}catch{}}
function readCache(){try{return JSON.parse(localStorage.getItem(cacheKey()));}catch{return null;}}

// ── UTILS ─────────────────────────────────────────────────────────
function getDonor(id){return donors.find(d=>d.id===id);}
function campaignDonorsAll(){return activeCampaignId?donors.filter(d=>d.campaignId===activeCampaignId):donors;}
function isActiveStatus(d){return !d.status||d.status==='active';}
// Active views/counts/exports all flow through campaignDonors(), so excluding
// archived + trashed here hides them everywhere at once.
function campaignDonors(){return campaignDonorsAll().filter(isActiveStatus);}
function canManageContact(d){return !!currentUser&&(currentUser.role==='admin'||d.ownerId===currentUser.id);}
function archivedDonors(){return campaignDonorsAll().filter(d=>d.status==='archived'&&canManageContact(d));}
function trashedDonors(){return campaignDonorsAll().filter(d=>d.status==='trashed'&&canManageContact(d));}
function updateDonor(id,ch){donors=donors.map(d=>d.id===id?{...d,...ch}:d);markContact(id);}
// Repair "mojibake" — UTF-8 text that got mangled on export (e.g. "itâ€™s" → "it’s").
// The mangled chars come from Windows-1252, whose byte values differ from their Unicode points
// in 0x80–0x9F, so map those back to their real bytes before re-decoding as UTF-8.
const CP1252_REV={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function fixMojibake(s){
  if(!s||!/[ÂÃâ]/.test(s))return s;
  try{const b=[];for(const ch of s){const cp=ch.codePointAt(0);let x;if(cp<=0xFF)x=cp;else if(CP1252_REV[cp]!=null)x=CP1252_REV[cp];else return s;b.push(x);}
    const dec=new TextDecoder('utf-8',{fatal:false}).decode(Uint8Array.from(b));return dec.indexOf('�')>=0?s:dec;}catch{return s;}
}
function str(v){return fixMojibake(String(v==null?'':v).trim());}
// Read-only note with a Show more/less toggle when long.
function noteRO(label,text){const t=text||'';const long=t.length>160;return `<div class="subhd" style="margin:11px 0 2px;">${esc(label)}</div><div class="pnote-ro${long?' clamp':''}">${esc(t)}</div>${long?'<button class="note-toggle" data-note-toggle>Show more ▾</button>':''}`;}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(n){return(!n&&n!==0)||n===0?'—':'$'+Number(n).toLocaleString();}
// Value-aware: a real 0 is a value (shows "$0"); only blank/unset shows "—".
function hasVal(x){return x!==null&&x!==undefined&&x!=='';}
function fmtT(x){return hasVal(x)?'$'+Number(x).toLocaleString():'—';}
function fmtDate(v){if(!v)return'';try{const d=new Date(typeof v==='number'?Math.round((v-25569)*86400000):v+'T12:00:00');return isNaN(d)?String(v):d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch{return String(v);}}
function isPledged(d){return(d.pledgeAmount&&d.pledgeAmount>0)||(d.preArcStage>=4)||d.postArcStage!==undefined;}
function isFulfilled(d){return d.pledgeAmount>0&&(d.pledgePaid||0)>=d.pledgeAmount;}
function taskDueStatus(d){if(!d)return'upcoming';const diff=Math.floor((new Date(d+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);return diff<0?'overdue':diff===0?'today':'upcoming';}
function taskDueLabel(d){if(!d)return'';const diff=Math.floor((new Date(d+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);if(diff<0)return`${Math.abs(diff)}d overdue`;if(diff===0)return'Due today';if(diff===1)return'Due tomorrow';return'Due '+new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}
// A pending task belongs to whoever created it. Only its creator sees it.
// Legacy tasks (no creator recorded) stay visible to anyone with contact access.
function pendingVisible(t){return !t.by||t.by===(currentUser&&currentUser.id);}
function getAllTasks(){return campaignDonors().flatMap(d=>(d.tasks||[]).filter(t=>!t.done&&pendingVisible(t)).map(t=>({...t,donorId:d.id,donorName:d.name})));}
function overdueTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='overdue');}
function todayTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='today');}
function upcomingTasks(){return getAllTasks().filter(t=>taskDueStatus(t.due)==='upcoming').sort((a,b)=>(a.due||'').localeCompare(b.due||''));}
// Completed tasks are shared: anyone who can see the contact sees them, newest first.
function completedTasks(){return campaignDonors().flatMap(d=>(d.tasks||[]).filter(t=>t.done).map(t=>({...t,donorId:d.id,donorName:d.name}))).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));}
function userName(id){const u=allUsers.find(x=>x.id===id);return u?(u.name||u.email):'';}

function getStreak(){return dashState.streak||{date:'',count:0,lastGoal:0};}
function displayStreakCount(){
  const s=getStreak();
  if(!s.date)return 0;
  const t=today();
  const y=new Date();y.setDate(y.getDate()-1);
  const yStr=y.toISOString().slice(0,10);
  return(s.date===t||s.date===yStr)?s.count:0;
}
function updateStreak(goalMet){
  const s=getStreak();
  const t=today();
  if(s.date===t)return s;
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  const newCount=goalMet?(s.date===yStr?s.count+1:1):0;
  dashState.streak={date:t,count:newCount,lastGoal:settings.dailyGoal};
  markDash();
  return dashState.streak;
}

function pledgeSummary(){
  const p=campaignDonors().filter(isPledged);
  const tp=p.reduce((s,d)=>s+(d.pledgeAmount||0),0);
  const paid=p.reduce((s,d)=>s+(d.pledgePaid||0),0);
  return{count:p.length,totalPledged:tp,totalPaid:paid,fulfilled:p.filter(isFulfilled).length,paidPct:tp>0?Math.round(paid/tp*100):0};
}
function getStats(){
  const D=campaignDonors();
  const total=D.length;
  const contacted=D.filter(d=>(d.interactions||[]).length>0).length;
  const ps=pledgeSummary();
  const tgt=D.reduce((s,d)=>s+(d.target||0),0);
  const courtingDonors=D.filter(d=>!isPledged(d));
  const totalRetailTarget=courtingDonors.reduce((s,d)=>s+(d.retailTarget||1),0);
  const totalRetailDone=courtingDonors.reduce((s,d)=>s+(d.interactions||[]).filter(i=>!['📄 Report','📰 Newsletter'].includes(i.type)).length,0);
  const pledgedDonors=D.filter(isPledged);
  const totalStewardTarget=pledgedDonors.reduce((s,d)=>s+(d.retailTarget||1)+(d.wholesaleTarget||1),0);
  const totalStewardDone=pledgedDonors.reduce((s,d)=>s+(d.interactions||[]).length,0);
  return{total,contacted,tgt,outPct:totalRetailTarget>0?Math.round(totalRetailDone/totalRetailTarget*100):0,
    stewardPct:totalStewardTarget>0?Math.round(totalStewardDone/totalStewardTarget*100):0,...ps};
}

// ── IMPORT ────────────────────────────────────────────────────────
function parseDonorRow(row){
  const name=str(row['Name']);if(!name)return null;
  const get=(...keys)=>{for(const k of keys){if(row[k]!==undefined&&row[k]!==''&&row[k]!==null)return row[k];}return '';};
  // Money parser: tolerate Salesforce-formatted values like "$5,000".
  const money=(...keys)=>{const n=parseFloat(String(get(...keys)).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
  // Boolean column (e.g. Salesforce "Deceased"): undefined if the column is absent/blank.
  const bool=(...keys)=>{const v=str(get(...keys)).toLowerCase();return v===''?undefined:['true','yes','y','1','x','✓','checked'].includes(v);};
  const tier=TIERS.includes(str(row['Tier']).toLowerCase())?str(row['Tier']).toLowerCase():'';
  // Additional (custom) fields — give the verbose Salesforce columns friendlier names, and make dates readable.
  const CUSTOM_RENAME={'Snapshot: Latest Event Attended (Primary Contact)':'Primary last event','Snapshot: Latest Event Attended Date (Primary Contact)':'Primary last event date','Snapshot: Latest Event Attended (Secondary Contact)':'Secondary last event','Snapshot: Latest Event Attended Date (Secondary Contact)':'Secondary last event date','Primary Contact: Last Activity':'Primary last activity'};
  const CUSTOM_DATE=new Set(['Snapshot: Latest Event Attended Date (Primary Contact)','Snapshot: Latest Event Attended Date (Secondary Contact)','Primary Contact: Last Activity']);
  const custom={};
  Object.keys(row).forEach(k=>{if(KNOWN_COLS.has(k))return;const v=CUSTOM_DATE.has(k)?fmtDate(row[k]):str(row[k]);if(v!=='')custom[CUSTOM_RENAME[k]||k]=v;});
  const high=money('High');
  const pid=str(get('Primary Contact: Contact ID'));
  const id=pid||(name+'_'+Math.random().toString(36).slice(2));
  // Year-by-year giving: Salesforce's RELATIVE labels (Last Year, 2 Years ago…) map to real
  // calendar years, plus YTD (current year) and any legacy fixed-year columns.
  const years={};const yr=new Date().getFullYear();
  [['Snapshot: Last Year donation summary',1],['Snapshot: 2 Years ago donation summary',2],['Snapshot: 3 Years ago donation summary',3],['Snapshot: 4 Years ago donation summary',4]].forEach(([k,back])=>{const v=money(k);if(v)years[String(yr-back)]=v;});
  const ytd=money('Snapshot: YTD donation summary');if(ytd)years[String(yr)]=ytd;
  ['2021','2022','2023','2024','2025'].forEach(y=>{const v=money(y);if(v)years[y]=v;});
  // "Last Year" is the annual-campaign figure — app-managed (pulled from a past campaign or typed),
  // NOT auto-filled from Salesforce total giving. Only take it if the file literally has an "Actual" column.
  const actual=money('Actual')||0;
  return{id,name,householdId:str(get('Account ID','Household: Account ID')),pName:str(get('Primary Contact: Name')),sName:str(get('Secondary Contact: Name')),
    pPhone:str(get('Primary Contact: Mobile Phone')),sPhone:str(get('Secondary Contact: Mobile Phone')),homePhone:str(get('Account Phone')),
    pEmail:str(get('Primary Contact: Email')),sEmail:str(get('Secondary Contact: Email')),
    pId:pid,sId:str(get('Secondary Contact: Contact ID')),
    pNotes:str(get('Primary Contact: Personal Notes','Primary Contact: Notes','Primary Contact: Description')),

function handleFile(file){
  const r=new FileReader();
  r.onload=e=>{
    let rows;
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      if(!wb.SheetNames.length){alert('That file has no sheets to read.');return;}
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }catch(err){alert('Could not read file: '+err.message);return;}
    if(!rows.length){alert('That sheet is empty — no data rows were found.');return;}
    if(rows[0]['Name']===undefined){
      alert('This file doesn’t have a "Name" column, so it can’t be a contact list.\n\nUse "Download sample" to see the expected columns.');return;
    }

    // Validate every row. Header is spreadsheet row 1, so data row i is row i+2.
    const issues=[]; // {row, level:'error'|'warning', name, msg}
    const valid=[];  // parsed contacts that will be imported
    const seenPid={};
    rows.forEach((row,i)=>{
      const excelRow=i+2;
      const name=str(row['Name']);
      if(!name){issues.push({row:excelRow,level:'error',name:'',msg:'No Name — row skipped (cannot import).'});return;}
      const missing=[];
      if(!str(row['Account ID'])&&!str(row['Household: Account ID']))missing.push('Account ID');
      if(!str(row['Primary Contact: Contact ID']))missing.push('Primary Contact: Contact ID');
      if(missing.length)issues.push({row:excelRow,level:'warning',name,msg:'Missing '+missing.join(' & ')+' — imports, but won’t sync with Salesforce.'});
      const pid=str(row['Primary Contact: Contact ID']);
      if(pid){
        if(seenPid[pid])issues.push({row:excelRow,level:'warning',name,msg:'Same Primary Contact ID as row '+seenPid[pid]+' — these will be treated as one contact.'});
        else seenPid[pid]=excelRow;
      }
      valid.push(parseDonorRow(row));
    });

    if(!valid.length){alert('No rows to import — every contact needs at least a Name.');return;}
    // Tag each parsed contact as New or Update (matched within the active campaign) for the wizard.
    const statuses=valid.map(p=>campaignDonorsAll().find(d=>(p.pId&&d.pId===p.pId)||(d.name===p.name))?'update':'new');
    showImportWizard({headers:Object.keys(rows[0]||{}),valid,issues,statuses});
  };
  r.readAsArrayBuffer(file);
}

// Applies the merge and sends the chosen contacts to the server. Match is ONLY within the active
// campaign (by Salesforce Contact ID then name) so an import can't steal a record from another campaign;
// new contacts get a campaign-scoped id; app-managed fields are filled but never blanked.
function applyImport(list){
  list.forEach(p=>{p.campaignId=activeCampaignId;
    const ex=campaignDonorsAll().find(d=>(p.pId&&d.pId===p.pId)||(d.name===p.name));
    if(!ex)p.id=activeCampaignId+'::'+(p.pId||('new_'+Math.random().toString(36).slice(2)));
    if(ex){p.id=ex.id;p.campaignId=ex.campaignId;p.interactions=ex.interactions;p.tasks=ex.tasks;p.preArcStage=ex.preArcStage;p.postArcStage=ex.postArcStage;
      p.pledgeAmount=ex.pledgeAmount;p.pledgePaid=ex.pledgePaid;p.pledgePlan=ex.pledgePlan||'';
      p.pledgePlanNote=ex.pledgePlanNote||'';p.payments=ex.payments||[];p.status=ex.status;
      p.retailTarget=ex.retailTarget;p.wholesaleTarget=ex.wholesaleTarget;
      p.high=p.high||ex.high||0;p.medium=p.medium||ex.medium||0;p.low=p.low||ex.low||0;p.target=ex.target||p.high||0;
      p.actual=p.actual||ex.actual||0;
      p.tier=p.tier||ex.tier||'';
      p.notes=p.notes||ex.notes||'';p.pNotes=p.pNotes||ex.pNotes||'';p.sNotes=p.sNotes||ex.sNotes||'';p.askMonthly=p.askMonthly==null?ex.askMonthly:p.askMonthly;p.prevMonthly=p.prevMonthly==null?ex.prevMonthly:p.prevMonthly;p.askNotes=p.askNotes||ex.askNotes||'';
      p.chaiClub=ex.chaiClub;p.chaiMonthly=ex.chaiMonthly;p.chaiAnnual=ex.chaiAnnual;
      p.custom=Object.assign({},ex.custom||{},p.custom||{});}});
  setStatus('saving');
  api('/contacts/bulk',{method:'POST',body:JSON.stringify({contacts:list})})
    .then(res=>{donors=res.contacts||donors;setStatus('saved');writeCache();render();
      alert(`Imported ${res.created} new contact${res.created!==1?'s':''}, updated ${res.updated}${res.skipped?', skipped '+res.skipped+' (no access)':''}.`);})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Import failed: '+err.message);});
}

// Two-step import: (1) preview how columns map, (2) choose who to import.
function showImportWizard({headers,valid,issues,statuses}){
  const mapped=[],additional=[];
  headers.forEach(h=>{if(!h)return;if(IMPORT_FIELD_MAP[h])mapped.push([h,IMPORT_FIELD_MAP[h]]);else additional.push(h);});
  const sel=valid.map(()=>true);
  let step=1;
  const m=document.createElement('div');m.className='overlay';document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m)close();});
  function draw(){
    if(step===1){
      m.innerHTML=`<div class="sheet"><div class="mtitle">Import · Step 1 of 2 — Check the columns</div>
        <div class="msub">Here's where each column in your file will go. Anything unrecognized becomes an <b>Additional Field</b> on the contact — nothing is thrown away.</div>
        <div class="imp-map">${mapped.map(([h,f])=>`<div class="imp-maprow"><span class="imp-col">${esc(h)}</span><span class="imp-arrow">→</span><span class="imp-fld">${esc(f)}</span></div>`).join('')||'<div class="bin-empty">No recognized columns.</div>'}</div>
        ${additional.length?`<div class="subhd" style="margin:14px 0 6px;">Additional fields (${additional.length})</div><div class="imp-extra">${additional.map(esc).join(' · ')}</div>`:''}
        <div class="mrow" style="margin-top:16px;"><button class="mbtn s" id="iw-cancel">Cancel</button><button class="mbtn p" id="iw-next">Next: choose who →</button></div>
      </div>`;
      m.querySelector('#iw-cancel').onclick=close;
      m.querySelector('#iw-next').onclick=()=>{step=2;draw();};
    }else{
      const total=valid.length,newCt=statuses.filter(s=>s==='new').length,updCt=total-newCt;
      const rowsHtml=valid.map((p,i)=>`<label class="iw-pick"><input type="checkbox" data-i="${i}" ${sel[i]?'checked':''}/><span class="iw-nm">${esc(p.name)}</span><span class="iw-tag ${statuses[i]}">${statuses[i]==='new'?'New':'Update'}</span></label>`).join('');
      m.innerHTML=`<div class="sheet"><div class="mtitle">Import · Step 2 of 2 — Choose who</div>
        <div class="msub">${total} contact${total!==1?'s':''} · <b>${newCt}</b> new · <b>${updCt}</b> updating${issues.length?` · ${issues.length} warning${issues.length!==1?'s':''}`:''}. Uncheck anyone you don't want to import.</div>
        <div class="iw-tools"><button class="chip" id="iw-all">Select all</button><button class="chip" id="iw-none">Select none</button><input class="inp" id="iw-search" placeholder="Filter by name…" style="flex:1;min-width:120px;"/></div>
        <div class="iw-list" id="iw-list">${rowsHtml}</div>
        <div class="mrow" style="margin-top:14px;"><button class="mbtn s" id="iw-back">← Back</button><button class="mbtn p" id="iw-go">Import selected</button></div>
      </div>`;
      const listEl=m.querySelector('#iw-list');
      const updateGo=()=>{m.querySelector('#iw-go').textContent='Import '+sel.filter(Boolean).length+' selected';};
      listEl.querySelectorAll('input[data-i]').forEach(cb=>cb.onchange=()=>{sel[+cb.dataset.i]=cb.checked;updateGo();});
      updateGo();
      m.querySelector('#iw-all').onclick=()=>{valid.forEach((_,i)=>sel[i]=true);listEl.querySelectorAll('input[data-i]').forEach(cb=>cb.checked=true);updateGo();};
      m.querySelector('#iw-none').onclick=()=>{valid.forEach((_,i)=>sel[i]=false);listEl.querySelectorAll('input[data-i]').forEach(cb=>cb.checked=false);updateGo();};
      m.querySelector('#iw-search').oninput=e=>{const q=e.target.value.toLowerCase();listEl.querySelectorAll('.iw-pick').forEach(l=>{l.style.display=l.querySelector('.iw-nm').textContent.toLowerCase().includes(q)?'':'none';});};
      m.querySelector('#iw-back').onclick=()=>{step=1;draw();};
      m.querySelector('#iw-go').onclick=()=>{const chosen=valid.filter((_,i)=>sel[i]);if(!chosen.length){alert('Nothing selected to import.');return;}close();applyImport(chosen);};
    }
  }
  draw();
}

function resetMicBtn(targetId){const btn=document.getElementById('mic-'+targetId);if(btn){btn.className='micbtn';btn.textContent='🎤';}}
function startMic(targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!window.isSecureContext){
    alert('Voice-to-text isn’t available here'+(!window.isSecureContext?' (needs a secure https connection)':' on this browser')+'.\n\nTip: tap the 🎤 on your phone keyboard to dictate straight into the note instead.');
    return;
  }
  if(recognition){try{recognition.stop();}catch(e){}}
  recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=e=>{const txt=e.results[0][0].transcript;const el=document.getElementById(targetId);if(el){el.value+=(el.value?' ':'')+txt;el.dispatchEvent(new Event('input'));}};
  recognition.onerror=e=>{micActive=false;micTarget=null;resetMicBtn(targetId);
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){alert('Microphone access is blocked. Allow mic access for this site in your browser settings, then tap 🎤 again.');}
    else if(e.error==='no-speech'){/* user said nothing — ignore quietly */}
    else if(e.error&&e.error!=='aborted'){alert('Voice input error: '+e.error);}
  };
  recognition.onend=()=>{micActive=false;micTarget=null;resetMicBtn(targetId);};
  try{
    recognition.start();
    micActive=true;micTarget=targetId;
    const btn=document.getElementById('mic-'+targetId);if(btn){btn.className='micbtn on';btn.textContent='⏹';}
  }catch(e){micActive=false;micTarget=null;resetMicBtn(targetId);alert('Could not start voice input. Make sure no other app is using the microphone, then try again.');}
}

// ── DASHBOARD CALL LIST ───────────────────────────────────────────
function getDashCalls(){
  if(dashState.day!==today()){dashState.doneCalls=[];dashState.day=today();markDash();}
  const goal=settings.dailyGoal||10;
  const sortMode=settings.dashSort||'tier';
  let pool=campaignDonors().filter(d=>!isPledged(d));
  if(sortMode==='overdue'){
    const odIds=new Set(overdueTasks().map(t=>t.donorId));
    pool=pool.sort((a,b)=>{const aOD=odIds.has(a.id)?1:0,bOD=odIds.has(b.id)?1:0;return bOD-aOD||(b.target||0)-(a.target||0);});
  } else if(sortMode==='tier'){
    const tierOrder={star:0,major:1,mid:2,general:3};
    pool=pool.sort((a,b)=>((tierOrder[a.tier]||3)-(tierOrder[b.tier]||3))||((b.target||0)-(a.target||0)));
  } else {
    pool=pool.sort((a,b)=>(b.target||0)-(a.target||0));
  }
  const odIds=new Set(overdueTasks().map(t=>t.donorId));
  const odPool=pool.filter(d=>odIds.has(d.id));
  const regPool=pool.filter(d=>!odIds.has(d.id));
  return [...odPool,...regPool].slice(0,goal);
}

function getFiltered(){
  return campaignDonors().filter(d=>{
    const q=searchVal.toLowerCase();const ms=!q||d.name.toLowerCase().includes(q)||(d.city||'').toLowerCase().includes(q);
    const mf=filterVal==='All'||d.tier===filterVal||(filterVal==='Overdue'&&overdueTasks().some(t=>t.donorId===d.id));
    const tab=listTab==='pledged'?isPledged(d):!isPledged(d);return ms&&mf&&tab;
  }).sort((a,b)=>{
    if(sortVal==='target')return(b.target||0)-(a.target||0);if(sortVal==='name')return a.name.localeCompare(b.name);
    if(sortVal==='activity')return(b.interactions?.length||0)-(a.interactions?.length||0);if(sortVal==='pledge')return(b.pledgeAmount||0)-(a.pledgeAmount||0);return 0;
  });
}

// ── RENDER: PLAN ───────────────────────────────────────────────────
// Projection logic: a CONTRIBUTION = their real commitment once committed (isPledged),
// else their hoped Low/Med/High. The per-contact hoped numbers are never altered here.
function planStats(){
  const D=campaignDonors();
  let committed=0,lowOut=0,medOut=0,highOut=0,nCommitted=0,nNoTarget=0;
  D.forEach(d=>{
    if(isPledged(d)){committed+=(d.pledgeAmount||0);nCommitted++;}
    else{lowOut+=(d.low||0);medOut+=(d.medium||0);highOut+=(d.high||0);if(![d.low,d.medium,d.high].some(hasVal))nNoTarget++;}
  });
  const goal=(settings.campaignGoals&&settings.campaignGoals[activeCampaignId])||0;
  return{total:D.length,nCommitted,nNoTarget,committed,goal,low:committed+lowOut,med:committed+medOut,high:committed+highOut};
}
// Years (e.g. 2025, 2024…) that actually have giving data, newest first — for the Plan sort dropdown.
function planYears(){const s=new Set();campaignDonors().forEach(d=>Object.keys(d.years||{}).forEach(y=>{if((d.years[y]||0)>0)s.add(y);}));return[...s].sort().reverse();}
function planSortVal(d){if(planSort==='tier')return({star:4,major:3,mid:2,general:1})[d.tier]||0;if(planSort==='largest')return d.largestDonation||0;if(planSort==='actual')return d.actual||0;if(planSort.indexOf('yr:')===0)return(d.years&&d.years[planSort.slice(3)])||0;return d.high||d.medium||d.low||0;}
function scenarioBarHTML(key,label,amt,goal,color){
  const pct=goal>0?Math.round(amt/goal*100):0;
  return`<div class="plan-scn">
    <div class="plan-scn-top"><span class="plan-scn-lbl">${label}</span><span class="plan-scn-amt" id="plan-${key}-amt">${fmt(amt)}</span></div>
    <div class="plan-scn-bg"><div class="plan-scn-fill" id="plan-${key}-bar" style="width:${goal>0?Math.min(100,pct):0}%;background:${color};"></div></div>
    <div class="plan-scn-sub" id="plan-${key}-pct">${goal>0?pct+'% of goal':'set a goal to see %'}</div>
  </div>`;
}
function updatePlanBars(){
  const s=planStats();
  [['low',s.low],['med',s.med],['high',s.high]].forEach(([k,amt])=>{
    const a=document.getElementById('plan-'+k+'-amt');if(a)a.textContent=fmt(amt);
    const bar=document.getElementById('plan-'+k+'-bar');const pc=document.getElementById('plan-'+k+'-pct');
    const pct=s.goal>0?Math.round(amt/s.goal*100):0;
    if(bar)bar.style.width=(s.goal>0?Math.min(100,pct):0)+'%';
    if(pc)pc.textContent=s.goal>0?pct+'% of goal':'set a goal to see %';
  });
}
// Fill each contact's "Last Year" from what they pledged in a past campaign (matched by Salesforce contact).
function showPullLastYear(){
  const others=campaigns.filter(c=>c.id!==activeCampaignId);
  if(!others.length){alert('There are no other campaigns to pull from yet.');return;}
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Pull last year's annual campaign pledges</div>
    <div class="msub">Fills each contact's "Last Year" with their <b>annual-campaign pledge</b> from the past campaign you pick (matched by Salesforce contact). Usually a one-time setup — you can still edit any by hand after.</div>
    ${others.map(c=>`<button class="savebtn alt" data-pull-src="${esc(c.id)}" style="text-align:left;margin-bottom:9px;">${esc(c.name)}${c.archived?' (archived)':''}</button>`).join('')}
    <div class="mrow" style="margin-top:8px;"><button class="mbtn s" id="pull-cancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('pull-cancel').onclick=()=>m.remove();
  m.querySelectorAll('[data-pull-src]').forEach(b=>b.onclick=()=>{m.remove();pullLastYearFrom(b.dataset.pullSrc);});
}
function pullLastYearFrom(srcId){
  const src=campaigns.find(c=>c.id===srcId);if(!src)return;
  const srcContacts=donors.filter(d=>d.campaignId===srcId);
  const cur=campaignDonors();let matched=0;
  cur.forEach(c=>{const m=srcContacts.find(d=>(c.pId&&d.pId===c.pId)||(d.name===c.name));if(m){updateDonor(c.id,{actual:m.pledgeAmount||0});matched++;}});
  render();
  alert(`Filled "Last Year" for ${matched} of ${cur.length} contact${cur.length!==1?'s':''} from "${src.name}".`+(matched<cur.length?' The rest had no match — enter those by hand.':''));
}
function renderPlan(){
  const s=planStats();
  const sorted=campaignDonors().slice();
  if(planSort==='name')sorted.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  else sorted.sort((a,b)=>planSortVal(b)-planSortVal(a));
  const yrs=planYears();
  const dn=campaignDonors();
  const hasLargest=dn.some(d=>(d.largestDonation||0)>0);
  const sortOpts=[['tier','By tier (Top first)'],['ask','Biggest ask (High)'],...yrs.map(y=>['yr:'+y,'Most given in '+y]),...(hasLargest?[['largest','Largest gift ever']]:[]),['name','Name (A–Z)']];
  const rows=sorted.map(d=>{
    const cells=isPledged(d)
      ?`<td class="plan-committed" colspan="3">✓ Committed ${fmt(d.pledgeAmount||0)} <span class="plan-note">— counts as actual</span></td>`
      :['low','medium','high'].map(k=>`<td><input class="tval-inp plan-tinp" data-plan-tgt="${k}" data-pid="${esc(d.id)}" type="text" inputmode="numeric" value="${hasVal(d[k])?Number(d[k]).toLocaleString():''}" placeholder="—"/></td>`).join('');
    const tierSel=`<select class="plan-tier" data-plan-tier="${esc(d.id)}"><option value=""${!d.tier?' selected':''}>— Tier —</option>${TIERS.map(t=>`<option value="${t}"${d.tier===t?' selected':''}>${TIER_CFG[t].label}</option>`).join('')}</select>`;
    const arch=canManageContact(d)?`<button class="plan-arch" data-plan-arch="${esc(d.id)}" title="Archive — hides from all lists">🗄 Archive</button>`:'';
    return`<tr><td class="plan-name"><span class="plan-link" data-goto="${esc(d.id)}">${esc(d.name)}</span></td><td class="plan-tiercell">${tierSel}</td>${cells}<td class="plan-act">${arch}</td></tr>`;
  }).join('');
  return`<div class="hdr"><div class="hdr-top"><div><div class="hdr-title">Campaign Plan</div><div class="hdr-sub">What your asks add up to vs. your goal</div></div></div></div>
  <div class="sbody">
    <div class="card plan-goal-card">
      <div class="plan-goal-lbl">Campaign Goal</div>
      <div class="plan-goal-row"><span class="plan-goal-cur">$</span><input id="plan-goal-inp" type="number" inputmode="numeric" value="${s.goal||''}" placeholder="Set your goal…"/></div>
      ${s.committed>0?`<div class="plan-goal-foot">${fmt(s.committed)} already committed by ${s.nCommitted} ${s.nCommitted===1?'person':'people'} — this counts toward every scenario below.</div>`:''}
    </div>
    <div class="card">
      <div class="ctitle">If everyone gives their…</div>
      ${scenarioBarHTML('low','🔵 Low',s.low,s.goal,'var(--brand)')}
      ${scenarioBarHTML('med','🟡 Medium',s.med,s.goal,'var(--amber)')}
      ${scenarioBarHTML('high','🟢 High',s.high,s.goal,'var(--emer)')}
      ${s.goal<=0?`<div class="plan-hint">💡 Set a campaign goal above to see how close each scenario gets you.</div>`:''}
    </div>
    <div class="card">
      <div class="ctitle" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><span style="display:flex;align-items:center;gap:8px;">Your asks ${s.nNoTarget>0?`<span class="plan-warn">${s.nNoTarget} with no target yet</span>`:''}</span>
      <select id="plan-sort" class="ssel" style="flex:0 1 auto;">${sortOpts.map(([v,l])=>`<option value="${v}"${planSort===v?' selected':''}>Sort: ${l}</option>`).join('')}</select></div>
      <div style="font-size:11.5px;color:var(--text-3);margin:2px 0 8px;">Set each person's <b>tier</b> first, then their High / Med / Low. Tap a name to open details · 🗄 archives someone who won't give.</div>
      <button class="chip" id="pull-lastyear-btn" style="font-size:11px;margin-bottom:10px;">↩ Pull last year's annual campaign pledges (one-time)</button>
      <input class="sinput" id="plan-search" placeholder="🔍 Search this list by name…" style="margin-bottom:10px;"/>
      <div class="plan-table-wrap"><table class="plan-table"><thead><tr><th>Contact</th><th>Tier</th><th>Low</th><th>Med</th><th>High</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="plan-empty">No contacts in this campaign yet.</td></tr>'}</tbody></table></div>
    </div>
  </div>`;
}

// ── TASKS: complete + follow-up prompt ─────────────────────────────
// Mark a task done (stamping who/when), then offer to set the next follow-up.
function completeTaskWithFollowup(donorId,taskId){
  const d=getDonor(donorId);if(!d)return;
  const now=Date.now();
  updateDonor(donorId,{tasks:(d.tasks||[]).map(t=>String(t.id)===String(taskId)?{...t,done:true,doneAt:now,doneBy:currentUser.id}:t)});
  render();
  showFollowupModal(donorId);
}
function uncompleteTask(donorId,taskId){
  const d=getDonor(donorId);if(!d)return;
  updateDonor(donorId,{tasks:(d.tasks||[]).map(t=>String(t.id)===String(taskId)?{...t,done:false,doneAt:undefined,doneBy:undefined}:t)});
  render();
}
function showFollowupModal(donorId){
  const d=getDonor(donorId);if(!d)return;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Task completed ✓</div>
    <div class="msub">Want to set a follow-up task for <b>${esc(d.name)}</b>?</div>
    <div class="mfield"><label class="mlbl">Follow-up</label><input class="inp" id="fum-note" placeholder="What's the next move?" style="width:100%;"/></div>
    <div class="mfield"><label class="mlbl">Due date (optional)</label><input class="inp" id="fum-date" type="date" style="width:100%;"/></div>
    <div class="mrow"><button class="mbtn s" id="fum-skip">No thanks</button><button class="mbtn p" id="fum-add">Add follow-up</button></div>
  </div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m)close();});
  document.getElementById('fum-skip').onclick=close;
  document.getElementById('fum-note').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('fum-add').click();});
  document.getElementById('fum-add').onclick=()=>{
    const el=document.getElementById('fum-note');const note=el.value.trim();const due=document.getElementById('fum-date').value;
    if(!note){el.focus();el.style.borderColor='var(--red)';return;}
    const dd=getDonor(donorId);if(!dd){close();return;}
    updateDonor(donorId,{tasks:[...(dd.tasks||[]),{id:Date.now(),note,due:due||'',done:false,by:currentUser.id}]});
    close();render();
  };
  setTimeout(()=>document.getElementById('fum-note')?.focus(),50);
}

function renderTasks(){

  if(!isFollow){
    const done=completedTasks();
    const crow=t=>`<div class="titem" data-search="${esc(((t.donorName||'')+' '+(t.note||'')).toLowerCase())}"><div class="tchk done" data-untd="${t.donorId}|${t.id}" title="Mark as not done">✓</div><div class="ttxt" data-goto="${t.donorId}"><span style="font-weight:700;color:var(--text);">${esc(t.donorName)}</span> — ${esc(t.note||'')}<div class="tby">✓ ${esc(userName(t.doneBy||t.by)||'Completed')}${t.doneAt?' · '+new Date(t.doneAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}</div></div></div>`;
