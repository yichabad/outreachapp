  }
  const od=overdueTasks(),td=todayTasks(),up=upcomingTasks().slice(0,25);
  const row=t=>`<div class="titem"><div class="tchk" data-gtd="${t.donorId}|${t.id}" title="Mark done"></div><div class="ttxt" data-goto="${t.donorId}"><span style="font-weight:700;color:var(--text);">${esc(t.donorName)}</span> — ${esc(t.note||'')}<div class="tdue ${taskDueStatus(t.due)}">${t.due?taskDueLabel(t.due):'No due date'}</div></div><div class="tacts"><input type="date" class="tdate-inp" data-tdate="${t.donorId}|${t.id}" value="${t.due||''}" title="Change due date"/><button class="tdel" data-gdel="${t.donorId}|${t.id}" title="Delete task">×</button></div></div>`;
  const sec=(title,arr)=>arr.length?`<h3>${title}</h3><div class="tcard">${arr.map(row).join('')}</div>`:'';
  return`<div class="hdr"><div class="hdr-top"><div><div class="hdr-title">Tasks</div><div class="hdr-sub">${od.length} overdue · ${td.length} today</div></div></div></div>
  ${tabBar}
  <div class="tsec">${sec(`🔴 Overdue (${od.length})`,od)}${sec(`🟡 Today (${td.length})`,td)}${sec('📅 Upcoming',up)}${od.length+td.length+up.length===0?`<div class="empty"><div class="empty-icon">✅</div><div class="empty-txt">No follow-up tasks!</div></div>`:''}</div>`;
}

function createCampaignPrompt(){
  const name=prompt('Name this campaign (for example: "2026 Annual Campaign"):');
  if(!name||!name.trim())return;
  setStatus('saving');
  api('/campaigns',{method:'POST',body:JSON.stringify({name:name.trim()})})
    .then(res=>{campaigns=res.campaigns||campaigns;activeCampaignId=res.campaign.id;settings.defaultCampaignId=activeCampaignId;markSettings();
      desktopDetailId=null;detailId=null;if(view==='detail')view='list';writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not create the campaign: '+err.message);});

function deleteCampaignPrompt(){
  const c=campaigns.find(x=>x.id===activeCampaignId);if(!c)return;
  const n=donors.filter(d=>d.campaignId===activeCampaignId).length;
  if(!confirm(`Delete the campaign “${c.name}” and permanently remove its ${n} contact${n!==1?'s':''}?\n\nThis cannot be undone.`))return;
  setStatus('saving');
  api('/campaigns/'+encodeURIComponent(activeCampaignId),{method:'DELETE'})
    .then(res=>{const goneId=c.id;campaigns=res.campaigns||[];donors=donors.filter(d=>d.campaignId!==goneId);
      activeCampaignId=(campaigns[0]&&campaigns[0].id)||null;settings.defaultCampaignId=activeCampaignId;markSettings();
      desktopDetailId=null;detailId=null;if(view==='detail')view='list';writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not delete the campaign: '+err.message);});
}

  if(name===null)return;const nm=name.trim();if(!nm||nm===c.name)return;
  setStatus('saving');
  api('/campaigns/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name:nm})})
    .then(res=>{campaigns=res.campaigns||campaigns;writeCache();setStatus('saved');render();})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not rename the campaign: '+err.message);});
}

    .then(res=>{campaigns=res.campaigns||campaigns;
      if(archived&&activeCampaignId===id){const nxt=campaigns.find(c=>!c.archived);activeCampaignId=nxt?nxt.id:activeCampaignId;settings.defaultCampaignId=activeCampaignId;markSettings();desktopDetailId=null;detailId=null;if(view==='detail')view='list';}

    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Could not update the campaign: '+err.message);});

function deleteCampaignById(id){
  const c=campaigns.find(x=>x.id===id);if(!c)return;

  if(!confirm(`Delete the campaign “${c.name}” and permanently remove its ${n} contact${n!==1?'s':''}?\n\nThis cannot be undone. (To keep the records but hide the campaign, Archive it instead.)`))return;
  setStatus('saving');
  api('/campaigns/'+encodeURIComponent(id),{method:'DELETE'})

const EMPTY_DETAIL='<div class="right-empty"><div><div class="re-icon">👈</div><div>Select a contact to view details</div></div></div>';

// ── MAIN RENDER ────────────────────────────────────────────────────
// Identifies "where" we are, so a re-render that stays put (e.g. editing a
// contact) can keep its scroll position instead of jumping to the top.
let lastRenderKey=null;
function renderKey(){const isD=window.innerWidth>=900;return view+'|'+(isD?(desktopDetailId||''):(detailId||''))+'|'+(isD?'d':'m');}
const SCROLLERS=['.right-panel','.left-scroll','.page'];
function render(){
  if(!currentUser){renderLogin();return;}
  // Never sit on an archived campaign — fall back to the first active one.
  if(campaigns.length&&!campaigns.some(c=>c.id===activeCampaignId&&!c.archived)){const v=campaigns.find(c=>!c.archived);if(v)activeCampaignId=v.id;}
  const isDesktop=window.innerWidth>=900;
  // Preserve scroll only when re-rendering the same place (not on navigation).
  const samePlace=renderKey()===lastRenderKey;
  const saved={};
  if(samePlace){SCROLLERS.forEach(s=>{const el=document.querySelector(s);if(el)saved[s]=el.scrollTop;});saved.__win=window.scrollY;}
  let leftContent='',rightContent='';
  if(view==='dashboard')leftContent=renderDashboard();
  else if(view==='list')leftContent=renderList();
  else if(view==='tasks')leftContent=renderTasks();
  else if(view==='plan')leftContent=renderPlan();
  else if(view==='settings')leftContent=renderSettings();
  else if(view==='admin')leftContent=renderAdmin();
  else if(view==='detail'&&!isDesktop)leftContent=renderDetail();

  if(isDesktop&&(view==='list'||view==='detail')){
    leftContent=renderList();
    rightContent=desktopDetailId?renderDetail(desktopDetailId):EMPTY_DETAIL;
  }
  // Plan tab: on desktop, opening a contact shows it in the right sidebar while you stay in Plan.
  const planSplit=isDesktop&&view==='plan'&&desktopDetailId;
  if(planSplit)rightContent=renderDetail(desktopDetailId);

  if(!(!isDesktop&&view==='detail'))leftContent=campaignSwitcherHTML()+leftContent;

  const nav=navHTML();
  const app=document.getElementById('app');
  if(isDesktop){
    if(view==='list'||view==='detail'||planSplit){
      app.innerHTML=`<div class="shell">${nav}<div class="left-panel"><div class="left-scroll">${leftContent}</div></div><div class="right-panel">${rightContent}</div></div>`;
    } else {
      app.innerHTML=`<div class="shell">${nav}<div class="page">${leftContent}</div></div>`;
    }
  } else {
    app.innerHTML=`<div class="mobile">${leftContent}</div>${nav}`;
  }
  attachEvents();
  if(samePlace){SCROLLERS.forEach(s=>{const el=document.querySelector(s);if(el&&saved[s]!=null)el.scrollTop=saved[s];});if(saved.__win!=null)window.scrollTo(0,saved.__win);}
  lastRenderKey=renderKey();
  try{if(currentUser){localStorage.setItem('ot_view_'+currentUser.id,view);const ad=isDesktop?desktopDetailId:detailId;if(ad)localStorage.setItem('ot_detail_'+currentUser.id,ad);else localStorage.removeItem('ot_detail_'+currentUser.id);}}catch{}
}

  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.goto)));

  // Settings
  document.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.st,f=b.dataset.sf;settings.tierDefaults[t][f]=Math.max(0,settings.tierDefaults[t][f]+parseInt(b.dataset.dir));markSettings();const el=document.getElementById(`s-${t}-${f==='retail'?'r':'w'}`);if(el)el.textContent=settings.tierDefaults[t][f];}));

function openDetail(id){
  if(window.innerWidth>=900){desktopDetailId=id;if(view!=='plan')view='list';render();}
  else{detailId=id;view='detail';render();}
}
function openDetailToLog(id){
  openDetail(id);
  requestAnimationFrame(()=>{
    const el=document.getElementById('log-note');
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});try{el.focus({preventScroll:true});}catch(e){el.focus();}}
  });
}

function attachDonorEvents(){
  const isDesktop=window.innerWidth>=900;
  document.querySelectorAll('.drow[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(bulkMode){const id=el.dataset.id;const f=getFiltered();const idx=f.findIndex(d=>d.id===id);
        if(e.shiftKey&&lastBulkIdx!==null&&idx>=0){const a=Math.min(lastBulkIdx,idx),b=Math.max(lastBulkIdx,idx);for(let i=a;i<=b;i++)bulkSel.add(f[i].id);lastBulkIdx=idx;render();return;}
        bulkSel.has(id)?bulkSel.delete(id):bulkSel.add(id);lastBulkIdx=idx;
        const cbx=el.querySelector('.dcb');if(cbx){cbx.className='dcb'+(bulkSel.has(id)?' on':'');cbx.textContent=bulkSel.has(id)?'✓':'';}
        el.classList.toggle('bulk-on',bulkSel.has(id));
        const cnt=document.getElementById('bulk-count');if(cnt)cnt.textContent=bulkSel.size+' selected';
        const ba=document.getElementById('ba-btn');if(ba)ba.disabled=bulkSel.size===0;
        const bw=document.getElementById('bw-btn');if(bw)bw.disabled=bulkSel.size===0;
        const ball=document.getElementById('ball-btn');if(ball)ball.textContent=(bulkSel.size>=getFiltered().length&&getFiltered().length>0)?'Clear all':'Select all';
        return;}
      if(isDesktop){desktopDetailId=el.dataset.id;const rp=document.querySelector('.right-panel');if(rp){rp.innerHTML=renderDetail(desktopDetailId);attachEvents();rp.scrollTop=0;lastRenderKey=renderKey();}
        document.querySelectorAll('.drow').forEach(r=>r.classList.remove('selected-row'));el.classList.add('selected-row');}
      else{detailId=el.dataset.id;view='detail';render();}
    });
  });
}

function showBulkAssignModal(){
  const sel=[...bulkSel];if(!sel.length)return;
  const names=sel.map(id=>getDonor(id)?.name||'').filter(Boolean);
  const candidates=allUsers;
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet"><div class="mtitle">Assign Contacts</div>
    <div class="msub">${sel.length} contact${sel.length!==1?'s':''}: ${esc(names.slice(0,3).join(', '))}${names.length>3?` +${names.length-3} more`:''}</div>
    <div class="mfield"><label class="mlbl">Assign to teammate</label>
      <select class="msel" id="ba-user">${candidates.map(u=>`<option value="${u.id}">${esc(u.name||u.email)}${u.id===(currentUser&&currentUser.id)?' (you)':''}</option>`).join('')}</select></div>
    <div class="msub" style="font-size:12px;margin-top:-4px;">They'll be added as someone who can see and edit these contacts. Existing access is kept. (Only contacts you own or admin can reassign.)</div>
    <div class="mrow"><button class="mbtn s" id="ba-cancel">Cancel</button><button class="mbtn p" id="ba-save">Assign</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('ba-cancel').onclick=()=>m.remove();
  document.getElementById('ba-save').onclick=async()=>{
    const uid=document.getElementById('ba-user').value;if(!uid)return;
    const btn=document.getElementById('ba-save');btn.disabled=true;btn.textContent='Assigning…';
    let ok=0,skip=0,fail=0;
    for(const id of sel){
      const d=getDonor(id);if(!d){fail++;continue;}
      if(d.ownerId===uid||(d.assignedUserIds||[]).includes(uid)){skip++;continue;}
      const ids=Array.from(new Set([...(d.assignedUserIds||[]),uid]));
      try{const res=await api('/contacts/'+encodeURIComponent(id)+'/assign',{method:'PUT',body:JSON.stringify({assignedUserIds:ids})});
        const i=donors.findIndex(x=>x.id===id);if(i>=0)donors[i]=res.contact;ok++;}
      catch(e){if(e.code===401)return;fail++;}
    }
    m.remove();bulkMode=false;bulkSel.clear();writeCache();render();
    alert(`Assigned ${ok} contact${ok!==1?'s':''}.`+(skip?` ${skip} already had access.`:'')+(fail?` ${fail} couldn't be reassigned (you must own them or be an admin).`:''));
  };
}

  const d=getDonor(contactId);if(!d)return;

  };
}

  const m=document.createElement('div');m.className='overlay';

  </div>`;

  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('u-cancel').onclick=()=>m.remove();
  document.getElementById('u-save').onclick=()=>{
    const name=document.getElementById('u-name').value.trim();
    const pass=document.getElementById('u-pass').value;
    const role=document.getElementById('u-role').value;
    const btn=document.getElementById('u-save');btn.disabled=true;btn.textContent='Saving…';

  document.getElementById('u-delete')?.addEventListener('click',()=>{
    if(!confirm('Delete this user? Contacts they own are kept; they will be unassigned from shared contacts.'))return;
    api('/users/'+editing.id,{method:'DELETE'}).then(()=>refreshUsers()).then(()=>{m.remove();render();}).catch(err=>{if(err.code!==401)alert(err.message);});
  });
}

      currentUser=r.user;await loadState();loadSectionPref();view='dashboard';render();
    }catch(e){
      renderLogin(e.code===401?'Invalid email or password':(e.message||'Sign-in failed'));
    }
  });
}

function doLogout(){
  api('/logout',{method:'POST'}).catch(()=>{}).then(()=>{currentUser=null;donors=[];allUsers=[];renderLogin();});
}

// ── FORGOT PASSWORD (public) ───────────────────────────────────────
function renderForgot(){
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="login-logo">OT</div>
    <div class="login-title">Reset password</div>
    <div class="login-sub" id="fg-sub">Enter your email to begin</div>
    <div class="login-err" id="fg-err" style="display:none;"></div>
    <div id="fg-step1">
      <label class="login-lbl">Email</label><input class="login-inp" id="fg-email" type="email" autocomplete="username" autocapitalize="none"/>
      <button class="login-btn" id="fg-continue">Continue</button>
    </div>
    <div id="fg-step2" style="display:none;">
      <label class="login-lbl" id="fg-q"></label><input class="login-inp" id="fg-ans" autocomplete="off"/>
      <button class="login-btn" id="fg-send">Send reset link</button>
    </div>
    <div id="fg-done" style="display:none;font-size:14px;color:var(--text-2);line-height:1.6;text-align:center;"></div>
    <div style="text-align:center;margin-top:16px;"><a href="#" id="fg-back" style="color:var(--brand);font-size:13px;text-decoration:none;">← Back to sign in</a></div>
  </div></div>`;
  const showErr=t=>{const e=document.getElementById('fg-err');e.style.display='block';e.textContent=t;};
  document.getElementById('fg-back').onclick=e=>{e.preventDefault();renderLogin();};
  document.getElementById('fg-continue').onclick=()=>{
    const email=document.getElementById('fg-email').value.trim();
    if(!email){showErr('Please enter your email.');return;}
    const btn=document.getElementById('fg-continue');btn.disabled=true;btn.textContent='Checking…';
    api('/forgot',{method:'POST',body:JSON.stringify({email})}).then(r=>{
      if(r.hasQuestion){
        window._fgEmail=email;
        document.getElementById('fg-err').style.display='none';
        document.getElementById('fg-step1').style.display='none';
        document.getElementById('fg-step2').style.display='block';
        document.getElementById('fg-sub').textContent='Answer your security question';
        document.getElementById('fg-q').textContent=r.question;
        document.getElementById('fg-ans').focus();
      }else{
        btn.disabled=false;btn.textContent='Continue';
        showErr('This account can’t be reset automatically (no security question is set). Please ask an administrator to reset your password.');
      }
    }).catch(err=>{btn.disabled=false;btn.textContent='Continue';showErr(err.message||'Something went wrong.');});
  };
  document.getElementById('fg-send').onclick=()=>{
    const answer=document.getElementById('fg-ans').value;
    if(!answer.trim()){showErr('Please enter your answer.');return;}
    const btn=document.getElementById('fg-send');btn.disabled=true;btn.textContent='Sending…';
    api('/forgot/answer',{method:'POST',body:JSON.stringify({email:window._fgEmail,answer})}).then(r=>{
      document.getElementById('fg-step2').style.display='none';
      document.getElementById('fg-err').style.display='none';
      document.getElementById('fg-sub').textContent='Check your email';
      const d=document.getElementById('fg-done');d.style.display='block';
      d.innerHTML='✅ We sent a reset link to <b>'+esc(r.emailHint||'your email')+'</b>.<br><br>Open that email and click the link to choose a new password. The link works for 45 minutes.';
    }).catch(err=>{btn.disabled=false;btn.textContent='Send reset link';showErr(err.message||'That didn’t work.');});
  };
}

// ── RESET PASSWORD PAGE (from the emailed link) ────────────────────
function isResetPage(){
  try{const u=new URL(location.href);return u.pathname.replace(/\/+$/,'').endsWith('/reset')&&!!u.searchParams.get('token');}catch{return false;}
}
function renderReset(){
  const app=document.getElementById('app');if(!app)return;
  const token=new URL(location.href).searchParams.get('token');
  const home=APP_BASE||'/';
  app.innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="login-logo">OT</div>
    <div class="login-title">Choose a new password</div>
    <div class="login-sub">Set a new password for your account</div>
    <div class="login-err" id="rs-err" style="display:none;"></div>
    <div id="rs-form">
      <label class="login-lbl">New password</label><input class="login-inp" id="rs-new" type="password" autocomplete="new-password" placeholder="At least 8 characters"/>
      <label class="login-lbl">Confirm password</label><input class="login-inp" id="rs-conf" type="password" autocomplete="new-password"/>
      <button class="login-btn" id="rs-save">Set new password</button>
    </div>
    <div id="rs-done" style="display:none;text-align:center;font-size:14px;color:var(--text-2);line-height:1.6;"></div>
    <div style="text-align:center;margin-top:16px;"><a href="${esc(home)}" style="color:var(--brand);font-size:13px;text-decoration:none;">← Back to sign in</a></div>
  </div></div>`;
  const showErr=t=>{const e=document.getElementById('rs-err');e.style.display='block';e.textContent=t;};
  document.getElementById('rs-save').onclick=()=>{
    const nw=document.getElementById('rs-new').value,cf=document.getElementById('rs-conf').value;
    if(nw.length<8){showErr('Password must be at least 8 characters.');return;}
    if(nw!==cf){showErr('The passwords don’t match.');return;}
    const btn=document.getElementById('rs-save');btn.disabled=true;btn.textContent='Saving…';
    api('/reset-password',{method:'POST',body:JSON.stringify({token,password:nw})}).then(()=>{
      document.getElementById('rs-form').style.display='none';
      document.getElementById('rs-err').style.display='none';
      const d=document.getElementById('rs-done');d.style.display='block';
      d.innerHTML='✅ Your password has been reset.<br><br><a class="login-btn" style="display:inline-block;text-decoration:none;text-align:center;box-sizing:border-box;" href="'+esc(home)+'">Sign in</a>';
    }).catch(err=>{btn.disabled=false;btn.textContent='Set new password';showErr(err.message||'Could not reset password.');});
  };
}

async function loadState(){
  const s=await api('/state');
  currentUser=s.me;allUsers=s.users||[];
  sfConnected=!!s.sfConnected;
  donors=s.contacts||[];
  settings=Object.assign(defaultSettings(),s.settings||{});
  campaigns=s.campaigns||[];
  activeCampaignId=(campaigns.find(c=>c.id===settings.defaultCampaignId)?settings.defaultCampaignId:(campaigns[0]&&campaigns[0].id))||null;
  dashState=s.dash||{day:'',doneCalls:[],streak:{date:'',count:0,lastGoal:0}};
  if(!dashState.streak)dashState.streak={date:'',count:0,lastGoal:0};
  if(!Array.isArray(dashState.doneCalls))dashState.doneCalls=[];
  writeCache();
}
const BACKUP_REASONS={'before-import':'before an import','before-restore':'before a restore','before-campaign-delete':'before deleting a campaign','auto':'auto-save'};
function showSfChanges(){
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="sheet" style="max-width:760px;"><div class="mtitle">Salesforce Change Report</div>
    <div class="msub" id="scr-sub">Loading…</div>
    <div style="margin:8px 0 10px;"><a class="chip" href="${APP_BASE}/api/sf/changes.csv">⬇ Download CSV</a></div>
    <div id="scr-body" style="max-height:60vh;overflow:auto;font-size:12px;"></div>
    <div class="mrow"><button class="mbtn s" id="scr-close">Close</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.getElementById('scr-close').onclick=()=>m.remove();
  const dir=d=>d==='app→sf'?'<span style="color:var(--brand);font-weight:700;">App → SF</span>':'<span style="color:var(--emer);font-weight:700;">SF → App</span>';
  api('/sf/changes?limit=500').then(r=>{
    document.getElementById('scr-sub').textContent=(r.total||0)+' change'+(r.total===1?'':'s')+' recorded'+((r.total||0)>500?' (showing latest 500)':'');
    const rows=(r.changes||[]).map(l=>`<tr style="border-bottom:1px solid var(--border);"><td style="padding:5px 6px;white-space:nowrap;color:var(--text-3);">${esc(new Date(l.at).toLocaleString())}</td><td style="padding:5px 6px;white-space:nowrap;">${dir(l.direction)}</td><td style="padding:5px 6px;">${esc(l.contactName||'')}<div style="color:var(--text-3);font-size:10.5px;">${esc(l.person||'')} · ${esc(l.field||'')}</div></td><td style="padding:5px 6px;"><span style="color:var(--text-3);">${esc(l.old||'—')}</span> → <b>${esc(l.new||'—')}</b></td><td style="padding:5px 6px;white-space:nowrap;color:var(--text-3);">${esc(l.by||'')}</td></tr>`).join('');
    document.getElementById('scr-body').innerHTML=rows?`<table style="width:100%;border-collapse:collapse;"><thead><tr style="text-align:left;color:var(--text-3);position:sticky;top:0;background:var(--surface);"><th style="padding:5px 6px;">When</th><th style="padding:5px 6px;">Direction</th><th style="padding:5px 6px;">Household / field</th><th style="padding:5px 6px;">Change</th><th style="padding:5px 6px;">By</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="bin-empty">No changes recorded yet.</div>';
  }).catch(err=>{if(err.code!==401)document.getElementById('scr-body').innerHTML='<div class="bin-empty">Could not load the change report.</div>';});
}
function loadSfStatus(){
  const el=document.getElementById('sf-card');if(!el)return;
  api('/sf/status').then(s=>{
    if(!s.configured){el.innerHTML='<div style="font-size:13px;color:var(--text-2);line-height:1.5;">Salesforce isn’t set up on the server yet.</div>';return;}
    if(s.connected){
      const who=s.user?`${esc(s.user.name||'')}${s.user.username?' · '+esc(s.user.username):''}`:'';
      const last=s.lastPullAt?new Date(s.lastPullAt).toLocaleString():'never';
      el.innerHTML=`<div class="ctitle" style="color:var(--emer);">✅ Connected to Salesforce</div>
        <div style="font-size:12.5px;color:var(--text-3);margin:4px 0 12px;line-height:1.5;">${who?('Signed in as '+who+'<br>'):''}${s.instanceUrl?'Org: '+esc(s.instanceUrl):''}${s.connectedBy?'<br>Connected by '+esc(s.connectedBy):''}</div>
        <div class="shead" style="margin-top:2px;">Contact info sync (two-way)</div>
        <div style="font-size:12px;color:var(--text-3);margin:2px 0 10px;line-height:1.5;">Names, mobiles, emails &amp; personal notes. Syncs both ways <b>once a day automatically</b> — your edits are sent up and Salesforce changes pulled down on the same daily run (or when you sync now). Nothing syncs instantly.<br>Last synced: <b>${esc(last)}</b></div>
        <button class="savebtn" id="sf-pull">⟳ Sync with Salesforce now</button>
        <button class="savebtn alt" id="sf-changes" style="margin-top:9px;">📋 View change report</button>
        <div id="sf-pull-out" style="font-size:12.5px;margin-top:10px;line-height:1.5;"></div>
        <div class="shead" style="margin-top:14px;">Connection</div>
        <button class="savebtn alt" id="sf-test">Test connection</button>
        <button class="savebtn" id="sf-disconnect" style="margin-top:9px;">Disconnect</button>
        <div id="sf-test-out" style="font-size:12.5px;margin-top:10px;line-height:1.5;"></div>`;
      document.getElementById('sf-pull').onclick=()=>{
        if(!confirm('Sync names, mobiles, emails and notes with Salesforce now?\n\nYour queued edits are sent up first, then Salesforce changes are pulled down (Salesforce wins where they still differ). Archived and recycle-bin contacts are skipped. Every change is recorded in the report.'))return;
        const o=document.getElementById('sf-pull-out');o.textContent='Syncing with Salesforce… (this can take a minute)';
        api('/sf/pull-contacts',{method:'POST',body:JSON.stringify({})}).then(async r=>{
          o.innerHTML='<span style="color:var(--emer);font-weight:700;">✓ Synced</span> — '+(r.pushed||0)+' pushed up, '+r.changes+' pulled down across '+r.scanned+' households.';
          await loadState();render();loadSfStatus();
        }).catch(err=>{if(err.code!==401)o.innerHTML='<span style="color:var(--red);">'+esc(err.message)+'</span>';});
      };
      document.getElementById('sf-changes').onclick=showSfChanges;
      document.getElementById('sf-test').onclick=()=>{const o=document.getElementById('sf-test-out');o.textContent='Testing…';api('/sf/test',{method:'POST'}).then(r=>{o.innerHTML=`<span style="color:var(--emer);font-weight:700;">✓ Working</span> (API v${esc(r.apiVersion)}) — ${r.accounts} households, ${r.contacts} contacts in Salesforce.`;}).catch(err=>{if(err.code!==401)o.innerHTML='<span style="color:var(--red);">'+esc(err.message)+'</span>';});};
      document.getElementById('sf-disconnect').onclick=()=>{if(!confirm('Disconnect Salesforce? Syncing will stop until you reconnect.'))return;api('/sf/disconnect',{method:'POST'}).then(()=>loadSfStatus()).catch(err=>{if(err.code!==401)alert(err.message);});};
    }else{
      el.innerHTML=`<div style="font-size:12.5px;color:var(--text-3);margin:0 0 12px;line-height:1.5;">Connect the app to your Salesforce org to sync donations and interactions.</div>
        <button class="savebtn" id="sf-connect">🔗 Connect to Salesforce</button>`;
      document.getElementById('sf-connect').onclick=()=>{location.href=APP_BASE+'/api/sf/connect';};
    }
  }).catch(err=>{if(err.code!==401)el.innerHTML='<div class="bin-empty">Could not load Salesforce status.</div>';});
}
function loadBackups(){
  api('/backups').then(res=>{
    const el=document.getElementById('backup-list');if(!el)return;
    const bs=res.backups||[];
    if(!bs.length){el.innerHTML='<div class="bin-empty">No backups yet.</div>';return;}
    el.innerHTML=bs.map(b=>`<div class="bin-row"><span class="bin-name" style="cursor:default;">${esc(new Date(b.at).toLocaleString())}<div style="font-size:11.5px;color:var(--text-3);font-weight:500;">${esc(BACKUP_REASONS[b.reason]||b.reason)} · ${b.contacts==null?'?':b.contacts} contacts · ${b.campaigns==null?'?':b.campaigns} campaigns</div></span><div class="bin-actions"><button class="chip" data-restore-backup="${esc(b.file)}">Restore</button></div></div>`).join('');
    el.querySelectorAll('[data-restore-backup]').forEach(btn=>btn.onclick=()=>restoreBackup(btn.dataset.restoreBackup));
  }).catch(()=>{});
}
function restoreBackup(file){
  if(!confirm('Restore this backup?\n\nYour current contacts, campaigns and settings will be replaced with this saved version. A snapshot of the current data is taken first, so this can be undone too.'))return;
  setStatus('saving');
  api('/backups/restore',{method:'POST',body:JSON.stringify({file})})
    .then(()=>loadState())
    .then(()=>{setStatus('saved');desktopDetailId=null;detailId=null;view='dashboard';render();alert('Done — your data has been rolled back to that version.');})
    .catch(err=>{if(err.code===401)return;setStatus('offline');alert('Restore failed: '+err.message);});
}

// Return to the tab the user was last on (falls back to Home).
function restoreView(){
  let v;try{v=localStorage.getItem('ot_view_'+(currentUser&&currentUser.id));}catch{}
  const ok=['dashboard','list','tasks','plan','settings','admin','detail'];
  if(v==='admin'&&!(currentUser&&currentUser.role==='admin'))v='dashboard';
  return ok.includes(v)?v:'dashboard';
}
// Reopen the contact that was open before a reload, so a refresh stays on the detail view.
function restoreDetail(){
  try{const sd=localStorage.getItem('ot_detail_'+(currentUser&&currentUser.id));
    if(sd&&getDonor(sd)){if(window.innerWidth>=900)desktopDetailId=sd;else detailId=sd;}}catch{}
  if(view==='detail'&&!detailId&&!desktopDetailId)view='list';
}
function handleSfReturn(){
  try{
    const u=new URL(location.href);const sf=u.searchParams.get('sf');if(!sf)return;
    const msg=u.searchParams.get('msg');
    u.searchParams.delete('sf');u.searchParams.delete('msg');
    history.replaceState({},'',u.pathname+(u.search||'')+u.hash);
    if(sf==='connected'){view='settings';render();setTimeout(()=>alert('✅ Salesforce connected!'),80);}
    else if(sf==='error'){setTimeout(()=>alert('Salesforce connection failed: '+(msg||'unknown error')),80);}
  }catch{}
}
async function boot(){
  try{
    const me=await api('/me');
    currentUser=me.user;
    await loadState();
    loadSectionPref();view=restoreView();restoreDetail();render();
    handleSfReturn();
  }catch(e){
    if(e.code===401){return;/* renderLogin already shown by api() */}
    const cache=readCache();
    if(currentUser&&cache){donors=cache.donors||[];settings=Object.assign(defaultSettings(),cache.settings||{});dashState=cache.dashState||dashState;campaigns=cache.campaigns||[];activeCampaignId=cache.activeCampaignId||(campaigns[0]&&campaigns[0].id)||null;loadSectionPref();view=restoreView();restoreDetail();render();setStatus('offline');}
    else{renderLogin('Could not reach the server. Please try again.');}
  }
}

let wasDesktopLayout=window.innerWidth>=900;
window.addEventListener('resize',()=>{
  const nowDesktop=window.innerWidth>=900;
  if(nowDesktop!==wasDesktopLayout){wasDesktopLayout=nowDesktop;if(currentUser)render();}
});
if(isResetPage()){renderReset();}else{boot();}
</script>
</body>
